[gcode_macro CHAMBER_OFF]
gcode:
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
  # bed_fan (heater_fan) will shut off automatically when bed cools < heater_temp
 
[gcode_macro SET_CHAMBER]
gcode:
  {% set target_chamber = params.CHAMBER_TEMP|default(0)|float %}
  SET_HEATER_TEMPERATURE heater=chamber target={target_chamber}

[gcode_macro _CHAMBER_HEATSOAK_START]
description: Non-blocking half of chamber heatsoak — kicks off chamber heating (+1C
  overshoot trick for faster arrival) and the part-cooling fan assist, but does not wait.
  Pair with _CHAMBER_HEATSOAK_WAIT once whatever should overlap the chamber heat-up
  (bed wait, mat-soak dwell, etc.) is done. Split out 2026-08-08 — see PRINT_START, which
  used to block fully on chamber before the bed wait and 10-min mat-soak dwell even
  started; now the chamber heats concurrently with both.
gcode:
    {% set target_chamber = params.CHAMBER_TEMP|default(0)|float %}
    RESPOND MSG="Heatsoak: {target_chamber}c"  # Display info on display
    {% if target_chamber > 0 and not printer["heater_generic chamber"].temperature >= target_chamber|float%} #wait for chamber temps
        SET_CHAMBER CHAMBER_TEMP={target_chamber+1} #+1 °C for faster temp target arrival
        M106 S204 #part cooling fan 80%
    {% elif target_chamber > 0 %}
        #already at/above target — set exact target directly, nothing to wait for later
        SET_CHAMBER CHAMBER_TEMP={target_chamber}
    {% endif %}


[gcode_macro _CHAMBER_HEATSOAK_WAIT]
description: Blocking half of chamber heatsoak — waits for chamber to reach target (only
  if _CHAMBER_HEATSOAK_START left it still climbing) and sets the final exact target.
gcode:
    {% set target_chamber = params.CHAMBER_TEMP|default(0)|float %}
    {% if target_chamber > 0 and not printer["heater_generic chamber"].temperature >= target_chamber-0.1 %}
        TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={target_chamber-0.1} #wait until chamber temp is very nearly reached
    {% endif %}
    {% if target_chamber > 0 %}
        SET_CHAMBER CHAMBER_TEMP={target_chamber} #set correct chamber target and let PID do its magic
    {% endif %}


[gcode_macro HEATSOAK_CHAMBER]
description: Blocking chamber heatsoak — heats to CHAMBER_TEMP and waits for it. Standalone
  convenience wrapper around _CHAMBER_HEATSOAK_START + _CHAMBER_HEATSOAK_WAIT for manual
  console use. PRINT_START calls the two halves separately instead (see print_start.cfg)
  so the chamber wait overlaps the bed wait and mat-soak dwell rather than blocking
  before either starts.
gcode:
    {% set target_chamber = params.CHAMBER_TEMP|default(0)|float %}
    _CHAMBER_HEATSOAK_START CHAMBER_TEMP={target_chamber}
    _CHAMBER_HEATSOAK_WAIT CHAMBER_TEMP={target_chamber}
