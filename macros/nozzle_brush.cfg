[gcode_macro CLEAN_NOZZLE]
description: Macro to clean nozzle on Micron R1, using Bambu Nozzle brush & Purge bucket.
variable_start_x: 52		# co-ordinate of left edge of nozzle brush
variable_start_y: 180	# co-ordinate of y-axis centre of nozzle brush
variable_start_z: 0.0		# co-ordinate of z height to use nozzle brush
variable_wipe_width: 33		# width of nozzle brush in mm
variable_wipe_qty: 10		# number of times to wipe nozzle
variable_wipe_spd: 200		# speed to wipe nozzle
variable_raise_distance: 10	# amount to raise toolhead after wipe
variable_zigzag_amplitude: 2.575	# max Y deviation from centerline (mm) - capped so start_y+amplitude stays <= Y max (190mm)
variable_zigzag_oscillations: 5	# peak/trough count per out or return stroke

gcode:
 {% if "xyz" not in printer.toolhead.homed_axes %}                   # check if printer is homed
   G28                                                               # home printer if not already done
 {% endif %}
 
 RESPOND PREFIX=🧹 MSG="Cleaning Nozzle..."                          # display information in console

 ### Move nozzle to start position ###

 G90                                                                 # absolute positioning
 G1 X{start_x} Y{start_y} F6000
 G1 Z{start_z} F1000

### Wipe nozzle with zig-zag Y-axis (direct peak-to-trough, amplitude capped at Y max) ###

 {% for wipes in range(1, (wipe_qty + 1)) %}
   {% set direction = 1 if wipes % 2 == 0 else -1 %}          # alternate starting sign each wipe for variation

   # Out stroke: start_x -> start_x + wipe_width
   {% for i in range(1, (zigzag_oscillations + 1)) %}
     {% set frac = i / (zigzag_oscillations + 1) %}
     {% set sign = direction if i % 2 == 1 else -direction %}
     G1 X{start_x + wipe_width * frac} Y{start_y + sign * zigzag_amplitude} F{wipe_spd * 60}
   {% endfor %}
   G1 X{start_x + wipe_width} Y{start_y} F{wipe_spd * 60}

   # Return stroke: start_x + wipe_width -> start_x
   {% for i in range(1, (zigzag_oscillations + 1)) %}
     {% set frac = i / (zigzag_oscillations + 1) %}
     {% set sign = -direction if i % 2 == 1 else direction %}
     G1 X{start_x + wipe_width - (wipe_width * frac)} Y{start_y + sign * zigzag_amplitude} F{wipe_spd * 60}
   {% endfor %}
   G1 X{start_x} Y{start_y} F{wipe_spd * 60}
 {% endfor %}
 
 ### Raise nozzle ###

 G91                                                                 # relative positioning
 G1 Z{raise_distance} F1000                                          # move nozzle away from bed
 G90                                                                 # back to absolute
 
 RESPOND PREFIX=✅ MSG="Nozzle cleaning complete"                    # display information in console
