[delayed_gcode _notify_print_complete]
# Fired by PRINT_END 120s after the print ends. Routed through the gcode_pushover notifier
# (title "Micron") — Moonraker's notify remote method only takes name + message (no title),
# and the event-driven pushover_complete notifier is intentionally disabled in moonraker.conf.
gcode:
    {action_call_remote_method("notify",
                               name="gcode_pushover",
                               message="Print complete: " ~ printer.print_stats.filename)}
