[delayed_gcode _notify_print_complete]
# Fired by PRINT_END 120s after the print ends. Routed through the gcode_pushover notifier
# (title "Micron") — Moonraker's notify remote method only takes name + message (no title),
# and the event-driven pushover_complete notifier is intentionally disabled in moonraker.conf.
gcode:
    {action_call_remote_method("notify",
                               name="gcode_pushover",
                               message="Print complete: " ~ printer.print_stats.filename)}

[gcode_macro _ON_PRINT_ERROR]
description: virtual_sdcard on_error_gcode (wired in printer.cfg, overriding mainsail.cfg's plain
  CANCEL_PRINT). Sends a Pushover alert, then cancels exactly as before. Klipper doesn't expose
  the error text here, so homing failure is inferred from homed_axes != xyz (e.g. a Beacon contact
  "Sample spread too large" G28 Z failure leaves "xy"). The notify call is single-brace Jinja so it
  fires at expansion time, before CANCEL_PRINT can wipe anything queued.
gcode:
    {% set homed = printer.toolhead.homed_axes %}
    {% set file = printer.print_stats.filename %}
    {% if homed != "xyz" %}
      {% set msg = "Homing failed (homed: '" ~ homed ~ "'), print aborted: " ~ file ~ ". See console." %}
    {% else %}
      {% set msg = "Print aborted by error: " ~ file ~ ". See console." %}
    {% endif %}
    {action_call_remote_method("notify", name="gcode_pushover", message=msg)}
    CANCEL_PRINT
