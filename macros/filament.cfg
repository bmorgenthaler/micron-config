##### Filament System — macros/filament.cfg #####
#
# Handles: load, unload, mid-print filament change, purge, sensor management
#
# Sensor topology:
#   filament_upper (thb:FS)     = PRE sensor  — far from hotend, detects spool runout early
#   filament_lower (thb:PROBE)  = POST sensor — near hotend, last line of defense
#
# Mid-print change flow (runout — upper or lower sensor trips while printing):
#   Two distinct paths depending on whether the lower sensor still shows filament present
#   when the upper sensor trips (split out 2026-08-09 — see _RUNOUT_HANDLER):
#   - True end-of-spool (upper empty, lower still loaded — the normal case): still-good
#     filament remains in the bowden/hotend, so nothing is cut or retracted. save print temp
#     → PAUSE (parked rear-left, X10/Y185 — same corner PARK/PRINT_END use; deliberately not
#     PAUSE's stock default rear-right corner, which is reserved for the future blobifier —
#     see PAUSE note below) → disable both sensors → re-enable upper → prompt to splice new
#     filament in behind the old → advance (fixed distance,
#     lower sensor can't gate this — it's already reading the old remnant) → purge (unlimited
#     retries, same as a deliberate swap — no way to know exactly how much old material needs
#     to clear) → confirm → clean nozzle → RESUME. See _RUNOUT_SPLICE_SEQUENCE.
#   - Break/emergency (both sensors clear): no guaranteed continuous remnant to splice
#     against safely. save print temp → PAUSE (parked at the crossbow cutter's own
#     safe_x/safe_y, not the generic corner — see PAUSE note below) → disable both sensors →
#     crossbow cut + retract → prompt insert → LOAD_FILAMENT → feed to lower → purge →
#     confirm → clean nozzle → RESUME.
#
# Mid-print change flow (deliberate — user calls CHANGE_FILAMENT, e.g. color swap):
#   same cut-based save/pause/unload/prompt/reload chain as the runout break path above,
#   just user-triggered
#   instead of sensor-triggered. Works whether printing or already manually paused.
#   M600 is a plain alias for CHANGE_FILAMENT, for slicers whose "Color Change G-code"
#   field wasn't repointed at it — see the warning on the M600 macro itself.
#
# Idle load flow:
#   insert → _INSERT_HANDLER → (auto-start gated on FILAMENT_VARS.autoload_enabled, default
#   False — toggle with SET_FILAMENT_AUTOLOAD ENABLE=1/0; one-shot, _INSERT_HANDLER clears it
#   back to False the moment it fires so it doesn't silently stay armed for the next runout/
#   CHANGE_FILAMENT reload; also resets to disabled on every Klipper restart) →
#   LOAD_FILAMENT (M104 non-blocking, feed to lower sensor cold, concurrently) →
#   M109 block for full temp → purge → confirm → done
#   Disabled autoload just responds with a prompt-to-run-LOAD_FILAMENT message instead — it
#   only gates the idle-insert path and has no effect on the runout or CHANGE_FILAMENT
#   mid-print flows below, which never auto-call LOAD_FILAMENT in the first place.
#
# Purge-until-clean loop: _LOAD_PURGE_PROMPT's "Purge Again" button just re-runs
# _LOAD_PURGE, capped at purge_retries (5) unless FILAMENT_VARS.unlimited_purge is set —
# CHANGE_FILAMENT sets it so a color swap can loop indefinitely until the color runs
# clean, without weakening the retry cap that catches a genuine clog on a fresh/runout
# load. The prompt always keeps an Abort button regardless, as an escape hatch.
#
# PAUSE Z_MIN=50 (runout/CHANGE_FILAMENT paths only): Mainsail's _CLIENT_VARIABLE park
# block is unconfigured (see mainsail.cfg), so a bare PAUSE only hops 2mm above the
# current Z — not enough clearance for the cut/retract. Z_MIN forces a real parking height
# for filament-change pauses without changing plain manual pauses.
#
# X/Y=cutter's safe_x/safe_y (2026-08-09): without this, PAUSE's own default park position
# (max.x-5, max.y-5 — the opposite corner from the cutter) meant the toolhead parked there
# first, then _CROSSBOW_DO_CUT dragged it all the way back across the bed to the cutter
# corner for the actual cut — pure wasted travel, and the thinner-clearance leg flagged in
# the caution note below. Parking directly at the cutter's own corner means the retract +
# cut happen right where PAUSE lands, no detour. Applies to both cut-based runout/CHANGE_
# FILAMENT paths (_RUNOUT_HANDLER's "both sensors clear" branch, _LOWER_RUNOUT_HANDLER,
# CHANGE_FILAMENT) — not the splice path below, which has its own override.
#
# X/Y=105/185 for the true-end-of-spool splice path specifically (_RUNOUT_HANDLER's "upper
# empty, lower still loaded" branch) — moved 2026-08-20 to park over the nozzle-brush catch
# bucket instead of PARK/PARK_AND_DISABLE/PRINT_END's rear-left X10/Y185 corner. Unlike those
# three (brief parks, heaters typically off or about to be), this pause can run hot and
# unattended for an indeterminate time while the user manually splices — ooze during that wait
# needs somewhere to land that isn't the bed/print. (Historical note: this corner was
# originally reserved for "the planned blobifier install" — that plan changed; BLOBIFIER
# actually operates at X1/Y185, rear-left, installed 2026-08-19. The brush-bucket move above
# is unrelated to that and would have been the right call either way.)
#
# Part-cooling fan: _UNLOAD_FILAMENT_SEQUENCE saves printer.fan.speed then kills it (M107)
# before the cut/retract — a live fan fights the heater holding temp at the nozzle during
# the cut and pushback (Prusa's own firmware has flip-flopped on an equivalent case for its
# own tip-forming — see prusa3d/Prusa-Firmware issue #1204). Restored via M106 in
# _LOAD_FILAMENT_DONE before RESUME, and also in _LOAD_FILAMENT_ABORT so an abandoned
# mid-print change doesn't leave it off for the rest of a troubleshooting session.
#
# All unload paths use explicit M109 to avoid _LOW_TEMP_CHECK silent failure bug.
#
# Unload mechanism (2026-08-08): UNLOAD_FILAMENT and _UNLOAD_FILAMENT_SEQUENCE are cut-based
# — no tip-forming blob. They share _CUT_UNLOAD_SEQUENCE, which uses the crossbow cutter's
# own retract/cut/pushback primitives (_CROSSBOW_DO_CUT, _CUT_TIP_ADJUST_CURRENT/
# _CUT_TIP_RESTORE_CURRENT in macros/crossbow_cut.cfg — same ones CUT_TIP uses) but skips
# CUT_TIP's optional tip-forming wiggle, then retracts in steps until the lower sensor
# clears and pulls back an additional fixed distance (unload_pullback_length, FILAMENT_VARS)
# past that trigger point. The old tip-form-and-long-pull routines are archived below as
# _UNLOAD_FILAMENT_LEGACY_TIPFORM / _UNLOAD_FILAMENT_SEQUENCE_LEGACY_TIPFORM — kept for
# reference/rollback, not called anywhere.
#
# Caution, partially resolved 2026-08-09: the crossbow cutter needs XY travel (to roughly
# X2-16/Y1-16 — below the Beacon mesh_min Y of 21.2, so no sliced print geometry can occupy
# that Y band) to reach the blade. PAUSE now parks directly at the cutter's safe_x/safe_y
# (see PAUSE note above), which removes the worst leg — the old cross-bed diagonal from the
# generic park corner to the cutter corner no longer happens at all. Still unaddressed:
# _CUT_UNLOAD_SEQUENCE's own +5mm pre-cut Z lift (capped at axis max) is the only clearance
# for whatever short travel remains once parked (pin/cut sweep, both within the safe_x/
# safe_y corridor), and CLEAN_NOZZLE (run manually or via _MIDPRINT_CLEAN_AND_RESUME) still
# has no clearance logic of its own — see that macro's description. Confirmed live
# 2026-08-09 on an 8.8mm test object; not yet validated on anything tall.

# ─────────────────────────────────────────────────────────────────
# VARIABLES
# ─────────────────────────────────────────────────────────────────

[gcode_macro FILAMENT_VARS]
variable_extruder_temp:          230    # fallback load/unload temp when no target is set
variable_ending_length:          -15    # retract after purge (mm, negative)
variable_purge_length:            30    # retry purge extrusion (mm) — used for "Purge Again" clicks.
                                         # Reduced from 35mm 2026-08-09, see initial_purge_length note.
                                         # Raised 20->30 2026-08-20: now routes through BLOBIFIER
                                         # (hardware/blobifier.cfg), whose purge_length_minimum is
                                         # 30mm — anything below that was being silently clamped up,
                                         # so this now matches what retries actually purge.
variable_initial_purge_length:    80    # first purge extrusion (mm) — shared by ALL first-shot
                                         # purges: plain LOAD_FILAMENT, _RUNOUT_SPLICE_LOAD, and
                                         # CHANGE_FILAMENT alike (same _LOAD_PURGE call, same
                                         # variable — deliberately uniform per 2026-08-11 decision,
                                         # so a plain splice/reload purges the same as a color swap's
                                         # first shot; "Purge Again" — purge_length below, unlimited
                                         # on CHANGE_FILAMENT — is what a dark<->light swap leans on
                                         # for extra, not a bigger initial shot).
                                         # Raised from 60mm 2026-08-11. Nozzle+heatbreak length
                                         # confirmed 48.80mm via E3D's own Revo HF/Voron dimension
                                         # diagram — matches this file's independently-measured
                                         # crossbow "48.8mm hotend" figure exactly. A two-stage
                                         # design (cold-feed to the hotend, then heat only for the
                                         # last 48.8mm) was considered and rejected: CUT_TIP's 15mm
                                         # pre-cut retract means the severed fragment spans 15mm to
                                         # ~71.8mm from the tip, so ~34mm of it is already sitting
                                         # inside the hot zone the instant it's cut — advancing
                                         # anything meaningful toward the tip needs full temp for
                                         # ~the whole trip, not just the last segment, so cold-feeding
                                         # partway would just stall/grind against a solid plug.
                                         # 80mm = the confirmed 48.8mm hotend + an estimated ~30mm
                                         # lower-sensor-to-hotend-top gap (sensor sits ~5mm above the
                                         # crossbow top, itself ~20-25mm above the hotend) — that gap
                                         # figure is derived, not directly measured. Not yet confirmed
                                         # by a live purge; this bench test is that confirmation.
variable_purge_retries:            5    # max retries before error prompt
variable_current_purge_retries:    0    # session retry counter — reset on each load start
variable_purge_flow_rate:         20    # purge flow (mm³/s); speed = (60*rate)/2.405
variable_filament_load_length:     5    # per-step feed increment toward lower sensor (mm)
variable_runout_splice_advance_length: 40 # true-end-of-spool splice only (_RUNOUT_SPLICE_LOAD):
                                         # fixed, unconditional feed distance (mm) to get new
                                         # filament from the upper sensor down to/past the lower
                                         # sensor and lightly engaged with the old remnant.
                                         # Measured upper-to-lower sensor gap + 5-10mm buffer.
                                         # Fixed 2026-08-16 — was 150mm ("30 steps *
                                         # filament_load_length"), copy-pasted from
                                         # LOAD_FILAMENT's worst-case/sensor-gated feed cap, a
                                         # number that only makes sense there because that loop
                                         # is gated (stops the instant filament_lower triggers).
                                         # This path can't gate the same way — filament_lower is
                                         # already reading true from the old remnant, not the new
                                         # spool — so it always ran the full unconditional
                                         # distance. Combined with the extruder staying hot the
                                         # whole time (PAUSE never turns the heater off), that was
                                         # 150mm of live ooze out the nozzle before the actual
                                         # purge even started. See project_runout_splice_purge_fix
                                         # memory for the full incident.
variable_mid_print_change:     False    # True when paused mid-print for filament change
variable_saved_extruder_temp:      0    # print temp saved before PAUSE; restored on RESUME
variable_purge_retry_flow_rate:    5    # retry flow (mm³/s) — avoids backpressure stall on re-prime
variable_unlimited_purge:      False    # True disables the purge_retries cap — set by CHANGE_FILAMENT
                                         # so a color swap can loop "purge more" until the color runs clean
variable_saved_fan_speed:          0    # part-cooling fan speed (0.0-1.0) saved before _UNLOAD_FILAMENT_SEQUENCE
                                         # kills it; restored on resume/abort
variable_unload_retract_step:      5    # mm per step while retracting the cut segment clear of the
                                         # lower sensor (mirrors filament_load_length's role in reverse)
variable_unload_retract_max_steps: 30    # cap on unload_retract_step loop (30*5=150mm, mirrors
                                         # LOAD_FILAMENT's 150mm feed cap) — if the lower sensor hasn't
                                         # cleared by then, something's wrong (jam/stuck fragment/sensor
                                         # fault); _CHECK_LOWER_CLEAR_AFTER_UNLOAD errors instead of
                                         # continuing to pull blind
variable_unload_pullback_length:  28    # extra retract past the point the lower sensor clears, cut-based
                                         # unload only. 2026-08-08: started at 20mm, live test showed 8mm
                                         # short — bumped to 28mm
variable_autoload_enabled:     False    # gates auto-start on filament_upper insert while idle (see
                                         # _INSERT_HANDLER). One-shot — _INSERT_HANDLER clears it back
                                         # to False itself the moment it triggers, so re-arm with
                                         # SET_FILAMENT_AUTOLOAD ENABLE=1 before each insert you want
                                         # auto-started. Also resets to False on every Klipper restart —
                                         # deliberately not SAVE_VARIABLE-backed. Does not affect mid-print
                                         # runout or CHANGE_FILAMENT flows, which never auto-call
                                         # LOAD_FILAMENT in the first place.

gcode:


# ─────────────────────────────────────────────────────────────────
# SENSOR HANDLERS
# ─────────────────────────────────────────────────────────────────

[gcode_macro _INSERT_HANDLER]
description: Called on filament_upper insert event.
gcode:
  {% set state = printer.print_stats.state %}
  {% if state == "printing" %}
    # Shouldn't happen during a live print — ignore silently
  {% elif state == "paused" %}
    # Filament detected while paused; let user trigger LOAD_FILAMENT manually or via prompt
    RESPOND PREFIX="🧵" MSG="Filament detected at upper sensor. Tap 'Load Filament' in the prompt or run LOAD_FILAMENT."
  {% elif printer["gcode_macro FILAMENT_VARS"].autoload_enabled %}
    # Idle + autoload enabled: auto-start load sequence. Temp target + heating is handled
    # inside LOAD_FILAMENT itself (non-blocking M104, overlapped with the feed) — no need
    # to block here too.
    RESPOND PREFIX="🧵" MSG="Filament inserted — starting load sequence."
    SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=autoload_enabled VALUE=False
    NOZZLE_LIGHTS_ON
    LOAD_FILAMENT
  {% else %}
    # Idle, autoload disabled (default). Require an explicit LOAD_FILAMENT call.
    RESPOND PREFIX="🧵" MSG="Filament detected at upper sensor. Run LOAD_FILAMENT to load it (or SET_FILAMENT_AUTOLOAD ENABLE=1 to auto-start on future inserts)."
  {% endif %}


[gcode_macro _RUNOUT_HANDLER]
description: Called on filament_upper runout. Manages clean pause and unload for mid-print change.
gcode:
  {% set state = printer.print_stats.state %}
  {% set lower_present = printer['filament_switch_sensor filament_lower'].filament_detected %}
  {% if state == "printing" %}
    {% if not lower_present %}
      # Both sensors clear — filament snapped somewhere upstream of the lower sensor too, no
      # guaranteed continuous remnant to splice against safely. Cut-based unload (below) is
      # the right call here: it needs a clean unload/reload, not a splice.
      RESPOND TYPE=error MSG="FILAMENT RUNOUT — both sensors clear. Emergency pause."
      SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=saved_extruder_temp VALUE={printer.extruder.target|int}
      SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=mid_print_change VALUE=True
      # Z_MIN=50: _CLIENT_VARIABLE custom_park_dz is unset (default 2mm hop), too close to the
      # print for the cut/retract below. Force real clearance for this path only.
      # X/Y park directly at the crossbow cutter's own safe_x/safe_y — without this, PAUSE's
      # default park (max.x-5, max.y-5, the opposite corner) then the cutter travel dragged
      # the toolhead across the whole bed for no reason. Parking here means the retract + cut
      # in _CUT_UNLOAD_SEQUENCE happen right where it lands, no detour.
      {% set cvars = printer["gcode_macro _CROSSBOW_CUT_VARS"] %}
      PAUSE X={cvars.safe_x} Y={cvars.safe_y} Z_MIN=50
      # PAUSE parks the head; M400 in _UNLOAD_FILAMENT_SEQUENCE waits for park moves
      _FS_DISABLE_ALL
      _UNLOAD_FILAMENT_SEQUENCE
    {% else %}
      # True end-of-spool: lower sensor still shows filament present, meaning there's still
      # usable material sitting in the bowden/hotend — the spool just ran out feeding it, not
      # a break. Cutting/retracting that remnant would be discarding still-good filament with
      # nothing to reserve it against (the spool's already empty, there's no "upstream" left).
      # Splice instead: leave the remnant in place, advance new filament in behind it, purge
      # until the old material is fully flushed out. See _RUNOUT_SPLICE_SEQUENCE. Confirmed
      # 2026-08-09 that the previous cut-based path was wrong for this specific case — a live
      # runout hit it and wasted the remaining filament for no reason.
      RESPOND TYPE=error MSG="FILAMENT RUNOUT — upper sensor empty, lower still loaded. Pausing for spool splice."
      SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=saved_extruder_temp VALUE={printer.extruder.target|int}
      SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=mid_print_change VALUE=True
      # X/Y=105/185, over the nozzle-brush catch bucket — moved here 2026-08-20 from the
      # original X10/Y185 (rear-left, matching PARK/PARK_AND_DISABLE/PRINT_END). Unlike those
      # three, this pause can sit hot and unattended for an indeterminate time while the user
      # manually splices, so ooze needs somewhere to land that isn't the bed/print. (The
      # original rationale here — "rear-right is where the blobifier is going" — is stale:
      # BLOBIFIER ended up at X1/Y185, rear-left, installed 2026-08-19, not rear-right.)
      PAUSE X=105 Y=185 Z_MIN=50
      _FS_DISABLE_ALL
      _RUNOUT_SPLICE_SEQUENCE
    {% endif %}
  {% elif state == "paused" %}
    RESPOND PREFIX="⚠️" MSG="Upper sensor triggered while paused — filament change already in progress."
  {% else %}
    RESPOND PREFIX="⚠️" MSG="Filament removed from upper sensor."
  {% endif %}


[gcode_macro _LOWER_RUNOUT_HANDLER]
description: Safety net — fires on filament_lower runout if upper sensor was bypassed (e.g. mid-path break).
gcode:
  {% set state = printer.print_stats.state %}
  {% set already_handling = printer["gcode_macro FILAMENT_VARS"].mid_print_change %}
  {% if state == "printing" and not already_handling %}
    RESPOND TYPE=error MSG="EMERGENCY: lower filament sensor empty — upper was not triggered. Pausing immediately."
    SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=saved_extruder_temp VALUE={printer.extruder.target|int}
    SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=mid_print_change VALUE=True
    # X/Y park at the cutter's safe_x/safe_y — see _RUNOUT_HANDLER for why.
    {% set cvars = printer["gcode_macro _CROSSBOW_CUT_VARS"] %}
    PAUSE X={cvars.safe_x} Y={cvars.safe_y} Z_MIN=50
    _FS_DISABLE_ALL
    _UNLOAD_FILAMENT_SEQUENCE
  {% endif %}


[gcode_macro _RUNOUT_SPLICE_SEQUENCE]
description: Internal — true end-of-spool runout only (_RUNOUT_HANDLER's "upper empty, lower
  still loaded" branch). Called after PAUSE and _FS_DISABLE_ALL. Does NOT cut or retract —
  unlike a deliberate CHANGE_FILAMENT swap or a real break, there's no reason to discard the
  filament still sitting in the bowden/hotend just because the spool ran out feeding it: it's
  still good material, and there's no "upstream" left to reserve it against anyway. Instead:
  kill the fan (same reasoning as _UNLOAD_FILAMENT_SEQUENCE), re-enable the upper sensor, and
  prompt for a splice — new filament fed in behind the old, then purge the old material out.
gcode:
  {% set fvars = printer["gcode_macro FILAMENT_VARS"] %}
  {% set target_temp = fvars.saved_extruder_temp if fvars.saved_extruder_temp > 0 else fvars.extruder_temp %}

  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=saved_fan_speed VALUE={printer.fan.speed}
  M107

  NOZZLE_LIGHTS_ON
  RESPOND PREFIX="🧵" MSG="_RUNOUT_SPLICE_SEQUENCE: Spool empty. Insert new filament behind the old, then tap Load."

  # Re-enable upper only — same convention as _UNLOAD_FILAMENT_SEQUENCE's post-unload state.
  # Lower stays disabled: it's already reading true from the old remnant and would be a false
  # signal for "new filament inserted" either way.
  _FS_ENABLE_UPPER
  _RUNOUT_SPLICE_PROMPT


[gcode_macro _RUNOUT_SPLICE_PROMPT]
description: Shown after a true end-of-spool runout. User feeds new filament in behind the
  remaining old filament, then confirms.
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Spool Empty"
  RESPOND TYPE=command MSG="action:prompt_text Insert new filament behind the old, then tap Load."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Load Filament|_RUNOUT_SPLICE_LOAD"
  RESPOND TYPE=command MSG="action:prompt_button Cancel (stay paused)|_FILAMENT_CHANGE_CANCEL"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _RUNOUT_SPLICE_LOAD]
description: Advances newly-inserted filament a fixed, unconditional distance
  (runout_splice_advance_length, the measured upper-to-lower sensor gap + buffer) — filament_lower
  can't gate this the way LOAD_FILAMENT's normal feed loop does, since it's already reading true
  from the old remnant, not the new spool. Waits for full target temp FIRST (M109, before any
  extrusion at all) — fixed 2026-08-16, this used to feed 150mm while only background-heating
  (M104, no wait), which was fine for LOAD_FILAMENT's genuinely-cold idle case but not here: PAUSE
  never turns the heater off, so this path's extruder is realistically still at/near print temp the
  whole time, meaning that 150mm ran fully molten and oozed straight out the nozzle before the
  purge even started. Advances, then hands off to the existing purge chain (_LOAD_PURGE) with
  unlimited_purge forced on, since there's no way to know exactly how much old material needs to
  clear before new filament runs clean — same "purge until it looks right, Abort always available"
  pattern CHANGE_FILAMENT already uses. Joins the same SAVE_GCODE_STATE name (LOAD_FILAMENT_state)
  LOAD_FILAMENT itself uses, so the existing _LOAD_FILAMENT_DONE / _LOAD_FILAMENT_ABORT /
  _MIDPRINT_CLEAN_AND_RESUME chain downstream needs no changes to handle this path too.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  {% set fvars = printer["gcode_macro FILAMENT_VARS"] %}
  {% set target_temp = fvars.saved_extruder_temp if fvars.saved_extruder_temp > 0 else fvars.extruder_temp %}

  # Happy-Hare-shaped hook — this path bypasses LOAD_FILAMENT entirely, so it needs its own
  # pre-load call (see the matching hook in LOAD_FILAMENT itself).
  _STANDALONE_PRE_LOAD

  RESPOND PREFIX="🧵" MSG="_RUNOUT_SPLICE_LOAD: Heating to {target_temp}C before any extrusion..."
  M104 S{target_temp}
  M109 S{target_temp}

  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=current_purge_retries VALUE=0
  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=unlimited_purge VALUE=True
  SAVE_GCODE_STATE NAME=LOAD_FILAMENT_state
  M83

  RESPOND PREFIX="🧵" MSG="_RUNOUT_SPLICE_LOAD: At temp. Advancing new filament {fvars.runout_splice_advance_length}mm to engage old remnant..."
  G1 E{fvars.runout_splice_advance_length} F300
  M400

  RESPOND PREFIX="🧵" MSG="_RUNOUT_SPLICE_LOAD: Purging old filament clear..."
  _LOAD_PURGE


[gcode_macro CHANGE_FILAMENT]
description: Deliberate mid-print filament change (color/material swap) — not a runout. Parks, unloads, prompts for reload.
gcode:
  {% set state = printer.print_stats.state %}
  {% set already_handling = printer["gcode_macro FILAMENT_VARS"].mid_print_change %}
  {% if state == "printing" %}
    RESPOND PREFIX="🧵" MSG="CHANGE_FILAMENT: Pausing for filament change."
    SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=saved_extruder_temp VALUE={printer.extruder.target|int}
    SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=mid_print_change VALUE=True
    SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=unlimited_purge VALUE=True
    # X/Y park at the cutter's safe_x/safe_y — see _RUNOUT_HANDLER for why.
    {% set cvars = printer["gcode_macro _CROSSBOW_CUT_VARS"] %}
    PAUSE X={cvars.safe_x} Y={cvars.safe_y} Z_MIN=50
    _FS_DISABLE_ALL
    _UNLOAD_FILAMENT_SEQUENCE
  {% elif state == "paused" and not already_handling %}
    # Already parked via a prior manual PAUSE — skip straight to unload.
    RESPOND PREFIX="🧵" MSG="CHANGE_FILAMENT: Already paused — unloading for filament change."
    SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=saved_extruder_temp VALUE={printer.extruder.target|int}
    SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=mid_print_change VALUE=True
    SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=unlimited_purge VALUE=True
    _FS_DISABLE_ALL
    _UNLOAD_FILAMENT_SEQUENCE
  {% elif state == "paused" %}
    RESPOND PREFIX="⚠️" MSG="CHANGE_FILAMENT: Filament change already in progress."
  {% else %}
    RESPOND TYPE=error MSG="CHANGE_FILAMENT: Not printing. Use UNLOAD_FILAMENT / LOAD_FILAMENT directly."
  {% endif %}


[gcode_macro M600]
description: Slicer color-change alias. Some slicer profiles emit M600 regardless of the
  custom "Color Change G-code" field — without this, an unrecognized M600 mid-print would
  hit virtual_sdcard's on_error_gcode and CANCEL the print outright instead of pausing.
gcode:
  CHANGE_FILAMENT


# ─────────────────────────────────────────────────────────────────
# LOAD FILAMENT (public entry point)
# ─────────────────────────────────────────────────────────────────

[gcode_macro LOAD_FILAMENT]
description: Load filament. Works from idle or mid-print paused state. Optional TEMP param overrides auto.
  Heats in the background and feeds to the lower sensor concurrently — the feed path is a
  mechanical pinch-gear push through the guide tube upstream of the heatbreak, so it needs no
  heat. Full temp is only awaited right before the purge, which is the first move that actually
  needs melted filament.
gcode:
  # Guard: refuse if actively printing
  {% if printer.print_stats.state == "printing" %}
    RESPOND TYPE=error MSG="LOAD_FILAMENT: Cannot load while printing."
  {% else %}
    {% set fvars = printer["gcode_macro FILAMENT_VARS"] %}
    {% set param_temp = params.TEMP|default(0)|int %}

    # Temp priority: explicit param > saved print temp (mid-print) > current target > fallback default
    {% if param_temp > 0 %}
      {% set target_temp = param_temp %}
    {% elif fvars.mid_print_change and fvars.saved_extruder_temp > 0 %}
      {% set target_temp = fvars.saved_extruder_temp %}
    {% elif printer.extruder.target > 0 %}
      {% set target_temp = printer.extruder.target|int %}
    {% else %}
      {% set target_temp = fvars.extruder_temp %}
    {% endif %}

    # Happy-Hare-shaped hook — fires before load starts.
    _STANDALONE_PRE_LOAD

    # Non-blocking: heat runs in the background while the feed below happens cold.
    RESPOND PREFIX="🧵" MSG="LOAD_FILAMENT: Heating to {target_temp}C (background), feeding now (mid_print={fvars.mid_print_change})"
    M104 S{target_temp}

    SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=current_purge_retries VALUE=0
    SAVE_GCODE_STATE NAME=LOAD_FILAMENT_state
    M83

    RESPOND PREFIX="🧵" MSG="LOAD_FILAMENT: Feeding to lower sensor..."
    {% for step in range(30) %}
      _FEED_TO_LOWER_SENSOR
    {% endfor %}
    # M400 is mandatory here, not just the usual restore-state convention: gcode dispatch
    # doesn't block on physical move completion, so without this the sensor check below can
    # (and, confirmed live 2026-08-08, did) fire while the last few feed moves are still
    # queued/in-flight — a false "did not reach lower sensor" error even though the filament
    # was on track and the sensor tripped true moments later. M400 drains the queue first so
    # the check reflects the real, settled sensor state.
    M400
    # Sensor check must happen at execution time, not Jinja expansion time.
    # _CHECK_LOWER_AFTER_FEED is a separate macro so its Jinja evaluates after the feed moves run.
    _CHECK_LOWER_AFTER_FEED
  {% endif %}


[gcode_macro _FEED_TO_LOWER_SENSOR]
description: Feed filament_load_length mm if lower sensor not yet triggered. Called in a loop by LOAD_FILAMENT.
gcode:
  {% set fll = printer["gcode_macro FILAMENT_VARS"].filament_load_length %}
  {% if not printer['filament_switch_sensor filament_lower'].filament_detected %}
    G1 E{fll} F300
  {% endif %}


[gcode_macro _CHECK_LOWER_AFTER_FEED]
description: Checks lower sensor after feed loop. Separate macro so Jinja evaluates at execution time.
gcode:
  {% if not printer['filament_switch_sensor filament_lower'].filament_detected %}
    RESPOND TYPE=error MSG="LOAD_FILAMENT: Filament did not reach lower sensor after 150mm. Check path and try again."
    M400
    NOZZLE_LIGHTS_ON
    RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_state
  {% else %}
    RESPOND PREFIX="✅" MSG="LOAD_FILAMENT: Lower sensor triggered. Waiting for full temp before purge."
    # printer.extruder.target already holds the value LOAD_FILAMENT commanded via M104 —
    # M109 here just blocks until that soak actually finishes (usually already done for
    # mid-print reloads, since the heater never turned off during unload).
    M109 S{printer.extruder.target|int}
    RESPOND PREFIX="🧵" MSG="LOAD_FILAMENT: At temp. Starting purge."
    _LOAD_PURGE
  {% endif %}


# ─────────────────────────────────────────────────────────────────
# PURGE CHAIN (load completion)
# ─────────────────────────────────────────────────────────────────

[gcode_macro _LOAD_PURGE]
description: Purge after load. Routes through BLOBIFIER (2026-08-20) — travels to the Blobifier
  tray, builds/sheds a blob, and cleans the nozzle; no longer a bare in-place extrusion. Requires
  homed axes + QGL applied, hard-errors otherwise.
gcode:
  {% set fvars = printer["gcode_macro FILAMENT_VARS"] %}
  {% set retries = fvars.purge_retries %}
  {% set current = fvars.current_purge_retries %}
  {% set is_retry = current > 0 %}
  {% set purge = fvars.purge_length if is_retry else fvars.initial_purge_length %}
  {% set flow = fvars.purge_retry_flow_rate if is_retry else fvars.purge_flow_rate %}
  {% set fspeed = ((60 * flow) / 2.405)|int %}

  {% if current < retries or fvars.unlimited_purge %}
    M83
    M400
    {% if is_retry %}
      G1 E-1 F1800                  # 1mm retract only — 2mm pulled too much melt pool
      G4 P3000                      # 3s dwell: melt zone recovery before retry
    {% endif %}
    # BLOBIFIER requires homed axes + QGL applied (hard-errors otherwise) — check here rather
    # than let it raise, so the error is attributable to _LOAD_PURGE in the console. Hard-error
    # rather than auto-home: LOAD_FILAMENT used to work stone-cold/unhomed, but that's no longer
    # true now that the purge goes through BLOBIFIER's tray/servo sequence — home + QGL first.
    {% if "xyz" not in printer.toolhead.homed_axes or not printer.quad_gantry_level.applied %}
      RESPOND TYPE=error MSG="_LOAD_PURGE: Not homed/QGL'd — home and QGL before loading filament."
      _LOAD_PURGE_PROMPT
    {% else %}
      # SKIP_CLEAN=1 + CONFIRM_BEFORE_SHEAR=1 (2026-08-21): this purge needs to be judged
      # TWICE now -- once at the nozzle before the blob gets sheared off (BLOBIFIER's own
      # "Verify Purge" prompt, CONFIRM_BEFORE_SHEAR), and once more after everything's done
      # and cleaned (_LOAD_PURGE_PROMPT below). CONTINUATION_MACRO=_LOAD_PURGE_PROMPT: can't
      # just call _LOAD_PURGE_PROMPT directly after this line like before -- BLOBIFIER's own
      # call returns immediately once it shows ITS prompt (Klipper prompts don't block), well
      # before the user has actually clicked Continue and the shear/clean have run. BLOBIFIER
      # calls this continuation itself once that's actually done.
      BLOBIFIER PURGE_LENGTH={purge} SKIP_CLEAN=1 CONFIRM_BEFORE_SHEAR=1 CONTINUATION_MACRO=_LOAD_PURGE_PROMPT
    {% endif %}
  {% else %}
    _LOAD_PURGE_ERROR
  {% endif %}


[gcode_macro _LOAD_PURGE_PROMPT]
description: Purge confirmation prompt. Always offers Abort too — unlimited_purge (CHANGE_FILAMENT)
  removes the retry cap, not the escape hatch, so a real blockage doesn't force endless purging.
gcode:
  {% set current = printer["gcode_macro FILAMENT_VARS"].current_purge_retries %}
  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=current_purge_retries VALUE={current + 1}
  RESPOND TYPE=command MSG="action:prompt_begin Filament Load"
  RESPOND TYPE=command MSG="action:prompt_text Is the filament extruding correctly?"
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Yes — Done|_LOAD_FILAMENT_DONE"
  RESPOND TYPE=command MSG="action:prompt_button Purge Again|_LOAD_PURGE"
  RESPOND TYPE=command MSG="action:prompt_button Abort|_LOAD_FILAMENT_ABORT"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _LOAD_PURGE_ERROR]
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Load Error"
  RESPOND TYPE=command MSG="action:prompt_text Maximum purge retries reached. Check toolhead for blockage."
  RESPOND TYPE=command MSG="action:prompt_button Abort|_LOAD_FILAMENT_ABORT"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _LOAD_FILAMENT_DONE]
description: Purge confirmed OK. Finalizes load and resumes print if mid-print change.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  {% set fvars = printer["gcode_macro FILAMENT_VARS"] %}
  # Require actual paused state, not just the mid_print_change flag (2026-08-09) — a print
  # cancelled mid-filament-change could leave mid_print_change stuck True (now also reset by
  # CANCEL_PRINT itself, see macros/overrides.cfg, but this check is the real backstop: it's
  # what actually stops a stale flag from routing a completely unrelated idle LOAD_FILAMENT
  # into the mid-print clean+resume chain, which tried to CLEAN_NOZZLE/RESUME on an unhomed,
  # non-printing system). Confirmed live 2026-08-09.
  {% set is_mid_print = fvars.mid_print_change and printer.print_stats.state == "paused" %}

  # Happy-Hare-shaped hook — fires after a confirmed-good purge, before toolhead state is
  # restored (matches Happy Hare's documented _MMU_POST_LOAD timing). Covers all three load
  # flows that converge here: plain LOAD_FILAMENT, CHANGE_FILAMENT's mid-print reload, and
  # _RUNOUT_SPLICE_LOAD.
  _STANDALONE_POST_LOAD

  # Retract end of purge blob before restore
  G1 E{fvars.ending_length} F1800
  M400

  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=current_purge_retries VALUE=0
  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=unlimited_purge VALUE=False
  RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_state
  NOZZLE_LIGHTS_ON

  {% if is_mid_print %}
    # Stay paused here (2026-08-09) instead of auto-resuming — gives a manual checkpoint
    # before the automatic clean-nozzle-then-resume sequence in _MIDPRINT_CLEAN_AND_RESUME.
    RESPOND PREFIX="🧵" MSG="Filament loaded. Ready to clean nozzle and resume."
    _MIDPRINT_RESUME_PROMPT
  {% else %}
    {% if fvars.mid_print_change %}
      # mid_print_change was True but we're not actually paused — stale flag from an
      # abandoned/cancelled mid-print change. Clear it so it doesn't keep misrouting.
      SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=mid_print_change VALUE=False
      RESPOND PREFIX="⚠️" MSG="_LOAD_FILAMENT_DONE: mid_print_change was set but print is not paused — treating as a plain load and clearing the stale flag."
    {% endif %}
    _FS_ENABLE_ALL
    # Plain idle/manual load — no RESUME to gate. Nozzle clean restored here 2026-08-21
    # (removed 2026-08-20, wrongly, on the assumption BLOBIFIER's own CLEAN_NOZZLE covered
    # it — but BLOBIFIER now runs with SKIP_CLEAN=1 from _LOAD_PURGE, specifically so the
    # confirmation prompt the user just answered still had something to judge. This is the
    # actual clean, now correctly timed after that confirmation instead of before it.
    _CLEAN_NOZZLE_IF_HOMED
    RESPOND PREFIX="✅" MSG="Filament loaded."
  {% endif %}


[gcode_macro _MIDPRINT_RESUME_PROMPT]
description: Shown after a mid-print filament reload's purge is confirmed. Requires manual
  confirmation (instead of auto-resuming) before _MIDPRINT_CLEAN_AND_RESUME's clean+resume
  sequence runs. Added 2026-08-09.
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Filament Change"
  RESPOND TYPE=command MSG="action:prompt_text Filament loaded and purged. Clean nozzle and resume?"
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Resume|_MIDPRINT_CLEAN_AND_RESUME"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _CLEAN_NOZZLE_IF_HOMED]
description: Runs CLEAN_NOZZLE only if XYZ is fully homed — this wrapper's own Z lift (below)
  needs Z homed before it can move, and moving to the brush unhomed is unsafe/meaningless.
  Was previously gated on "xy" only, which crashed with "Must home axis first" any time XY
  was homed but Z wasn't (e.g. right after idle_timeout's M18 clears all three axes and only
  XY gets re-homed upstream) — widened to require "xyz" 2026-08-15, see
  [[project_idle_homing_z_gap_fix]]. Small Z lift first for approach clearance, same reasoning
  as _CUT_UNLOAD_SEQUENCE's and the old inline _MIDPRINT_CLEAN_AND_RESUME lift. Shared by both
  the mid-print clean+resume path and the plain idle/manual load completion path
  (_LOAD_FILAMENT_DONE) — added 2026-08-09 alongside the mid_print_change stale-flag fix,
  so an idle load after a cancelled mid-print change still gets its nozzle cleaned even
  though it no longer takes the mid-print branch.
gcode:
  {% set th = printer.toolhead %}
  {% if "xyz" in th.homed_axes %}
    {% set lift_z = [th.position.z + 5.0, th.axis_maximum.z]|min %}
    G0 Z{lift_z} F3000
    CLEAN_NOZZLE
  {% else %}
    RESPOND PREFIX="⚠️" MSG="_CLEAN_NOZZLE_IF_HOMED: XYZ not fully homed — skipping nozzle clean."
  {% endif %}


[gcode_macro _MIDPRINT_CLEAN_AND_RESUME]
description: Runs on manual confirmation after a mid-print filament reload. Nozzle clean
  restored here 2026-08-21 (removed 2026-08-20, wrongly, on the assumption BLOBIFIER's own
  CLEAN_NOZZLE covered it — but BLOBIFIER now runs with SKIP_CLEAN=1 from _LOAD_PURGE,
  specifically so the load-confirmation prompt the user answers before reaching this macro
  still had something to judge; this is the actual clean, now correctly timed after that
  confirmation). Finishes with an M109 to confirm temp is still holding (target never actually
  changes across the mid-print flow, so this is a hold-check, not a reheat) plus the sensor/
  fan restore that used to be inline in _LOAD_FILAMENT_DONE, then the real print RESUME — but
  only if the printer is actually paused (2026-08-09: guards against a stale mid_print_change
  flag reaching this macro with nothing real to resume; see _LOAD_FILAMENT_DONE and
  CANCEL_PRINT in macros/overrides.cfg for the two other layers of the same fix). RESUME
  restores the paused XY/Z position on its own — no separate "move into place" step needed
  here. Added 2026-08-09.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  {% set fvars = printer["gcode_macro FILAMENT_VARS"] %}

  _CLEAN_NOZZLE_IF_HOMED

  # M109 here just confirms/holds at saved_extruder_temp — the target was never actually
  # changed anywhere in the mid-print flow, so this isn't a "reheat" to a different value.
  RESPOND PREFIX="🧵" MSG="Confirming {fvars.saved_extruder_temp}C before resuming."
  M109 S{fvars.saved_extruder_temp}
  _FS_ENABLE_ALL
  # Restore whatever part-cooling speed was running before _UNLOAD_FILAMENT_SEQUENCE killed it
  M106 S{(fvars.saved_fan_speed * 255)|int}
  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=mid_print_change VALUE=False
  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=saved_extruder_temp VALUE=0
  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=saved_fan_speed VALUE=0
  {% if printer.pause_resume.is_paused %}
    RESUME
  {% else %}
    RESPOND PREFIX="⚠️" MSG="_MIDPRINT_CLEAN_AND_RESUME: Print is not paused — skipping RESUME (state was stale, nothing to resume)."
  {% endif %}


[gcode_macro _LOAD_FILAMENT_ABORT]
description: User abandoned load after max retries. Print remains paused if mid-print.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  # Happy-Hare-shaped hook — fires on the one true "user gave up" terminal state for the load
  # side. Other error/jam branches (_CHECK_LOWER_AFTER_FEED, _CHECK_LOWER_CLEAR_AFTER_UNLOAD)
  # keep their own existing RESPOND TYPE=error handling and don't call this hook.
  _STANDALONE_ERROR
  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=current_purge_retries VALUE=0
  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=unlimited_purge VALUE=False
  RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_state
  NOZZLE_LIGHTS_ON

  {% if printer["gcode_macro FILAMENT_VARS"].mid_print_change %}
    # Restore fan even though we're staying paused — otherwise it sits off for the whole
    # troubleshooting session and easily gets forgotten before the eventual manual RESUME.
    M106 S{(printer["gcode_macro FILAMENT_VARS"].saved_fan_speed * 255)|int}
    SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=saved_fan_speed VALUE=0
    RESPOND TYPE=error MSG="Load aborted. Print remains paused. Fix toolhead then run LOAD_FILAMENT."
  {% else %}
    RESPOND TYPE=error MSG="Filament load aborted."
  {% endif %}


# ─────────────────────────────────────────────────────────────────
# UNLOAD FILAMENT — cut-based (public entry point + internal runout/CHANGE_FILAMENT copy)
# ─────────────────────────────────────────────────────────────────
#
# Both macros below share _CUT_UNLOAD_SEQUENCE (crossbow cut, no tip-forming, retract-to-
# sensor-clear + fixed pull-back). See the file header comment for the full design note and
# the not-yet-live-validated XY-travel caution.

[gcode_macro UNLOAD_FILAMENT]
description: Manual unload via the crossbow cutter. Cuts filament near the nozzle (no
  tip-forming blob), then retracts until the lower sensor clears plus a fixed pull-back.
  Optional TEMP and PULLBACK (mm) params override FILAMENT_VARS defaults for a single call —
  handy for testing pull-back distance without editing the config. Safe to call from console
  at any time.
gcode:
  {% set fvars = printer["gcode_macro FILAMENT_VARS"] %}
  {% set param_temp = params.TEMP|default(0)|int %}
  {% set param_pullback = params.PULLBACK|default(0)|float %}

  # Temp priority: explicit param > current target > fallback default
  {% if param_temp > 0 %}
    {% set target_temp = param_temp %}
  {% elif printer.extruder.target > 0 %}
    {% set target_temp = printer.extruder.target|int %}
  {% else %}
    {% set target_temp = fvars.extruder_temp %}
  {% endif %}

  M400
  SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_state
  {% if param_pullback > 0 %}
    _CUT_UNLOAD_SEQUENCE TARGET_TEMP={target_temp} PULLBACK={param_pullback}
  {% else %}
    _CUT_UNLOAD_SEQUENCE TARGET_TEMP={target_temp}
  {% endif %}
  RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_state
  NOZZLE_LIGHTS_ON
  RESPOND PREFIX="✅" MSG="UNLOAD_FILAMENT: Done"


[gcode_macro _UNLOAD_FILAMENT_SEQUENCE]
description: Internal unload for runout/CHANGE_FILAMENT flow. Called after PAUSE and
  _FS_DISABLE_ALL. Cut-based (see _CUT_UNLOAD_SEQUENCE) — no heat guard needed since a print
  was already running.
gcode:
  {% set fvars = printer["gcode_macro FILAMENT_VARS"] %}
  # Use saved print temp — target may already be cooling after PAUSE
  {% set target_temp = fvars.saved_extruder_temp if fvars.saved_extruder_temp > 0 else fvars.extruder_temp %}

  # Kill the part-cooling fan for the swap — see file header note on fan-vs-heater during cut.
  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=saved_fan_speed VALUE={printer.fan.speed}
  M107

  # NOTE: was "_NOZZLE_LIGHTS_BRIGHT" — never a real macro (confirmed live 2026-08-08,
  # "Unknown command" warning; only NOZZLE_LIGHTS_ON/_OFF exist, no separate bright variant).
  # Non-fatal (Klipper just warns and continues), but fixing to the real call.
  NOZZLE_LIGHTS_ON
  M400
  SAVE_GCODE_STATE NAME=UNLOAD_SEQ_state

  _CUT_UNLOAD_SEQUENCE TARGET_TEMP={target_temp}

  RESTORE_GCODE_STATE NAME=UNLOAD_SEQ_state
  RESPOND PREFIX="✅" MSG="_UNLOAD_FILAMENT_SEQUENCE: Filament unloaded."

  # Re-enable upper sensor only: detect new filament insert; lower stays off until after load
  _FS_ENABLE_UPPER
  _FILAMENT_INSERT_PROMPT


[gcode_macro _CUT_UNLOAD_SEQUENCE]
description: Shared cut-based unload core. TARGET_TEMP required. Optional PULLBACK (mm)
  overrides FILAMENT_VARS.unload_pullback_length for this call. Heats, lifts Z a little for
  cutter transit clearance, detours to the Blobifier tray via _STANDALONE_PRE_UNLOAD ->
  BLOBIFIER_PARK (2026-08-20), retracts (no tip-form wiggle), cuts at the crossbow cutter,
  pushes the fragment back past the PTFE/metal junction (same primitives as CUT_TIP in
  macros/crossbow_cut.cfg), then retracts in steps until the lower sensor clears and pulls
  back the extra fixed amount. Caller owns SAVE_GCODE_STATE/RESTORE_GCODE_STATE, fan/light
  bookkeeping, and any post-unload prompt.
gcode:
  {% set cvars = printer["gcode_macro _CROSSBOW_CUT_VARS"] %}
  {% set fvars = printer["gcode_macro FILAMENT_VARS"] %}
  {% set target_temp = params.TARGET_TEMP|int %}
  {% set pullback = params.PULLBACK|default(fvars.unload_pullback_length)|float %}

  RESPOND PREFIX="✂️" MSG="_CUT_UNLOAD_SEQUENCE: Heating to {target_temp}C"
  M109 S{target_temp}

  {% if "xy" not in printer.toolhead.homed_axes %}
    RESPOND PREFIX="✂️" MSG="_CUT_UNLOAD_SEQUENCE: Homing XY before cut"
    G28 X Y
  {% endif %}
  {% if "z" not in printer.toolhead.homed_axes %}
    # idle_timeout's M18 clears all three axes together, but the XY-only guard above only
    # ever re-homed XY — Z was left unhomed and the very next line (G0 Z...) faulted with
    # "Must home axis first" the moment this ran after a real idle period. See
    # [[project_idle_homing_z_gap_fix]]. Plain G28 Z is the established pattern for
    # standalone Z (re)homing on this Beacon setup (home_method: contact when unhomed,
    # proximity once homed) — matches QUAD_GANTRY_LEVEL's G28 Z in hardware/beacon.cfg.
    RESPOND PREFIX="✂️" MSG="_CUT_UNLOAD_SEQUENCE: Homing Z before cut"
    G28 Z
  {% endif %}

  # PARK-style pre-cut Z lift — cheap transit-clearance margin for the cutter's XY travel.
  # See file header caution: not a substitute for full validation against a tall print.
  # th is captured here, after any homing above, not at the top of the macro — Jinja
  # {% set %} evaluates at template expansion time (before any gcode above executes), so
  # grabbing it earlier would snapshot the stale pre-homing Z position instead of wherever
  # G28 Z actually left the toolhead.
  {% set th = printer.toolhead %}
  {% set lift_z = [th.position.z + 5.0, th.axis_maximum.z]|min %}
  G0 Z{lift_z} F3000

  # Happy-Hare-shaped hook — fires BLOBIFIER_PARK (see _STANDALONE_SEQUENCE_VARS in
  # macros/standalone_mmu_vars.cfg), retracting and parking at the Blobifier tray before the
  # cut sequence below does its own pre-cut retract.
  _STANDALONE_PRE_UNLOAD

  M83
  G92 E0

  RESPOND PREFIX="✂️" MSG="_CUT_UNLOAD_SEQUENCE: Retracting {cvars.retract_length}mm prior to cut (no tip-form)"
  G1 E-{cvars.retract_length} F{cvars.extruder_move_speed * 60}
  M400

  _CUT_TIP_ADJUST_CURRENT
  _CROSSBOW_DO_CUT
  _CUT_TIP_RESTORE_CURRENT

  {% if cvars.retract_length > 0 %}
    RESPOND PREFIX="✂️" MSG="_CUT_UNLOAD_SEQUENCE: Pushing tip fragment back {cvars.retract_length}mm"
    G1 E{cvars.retract_length} F{cvars.extruder_move_speed * 60}
    G4 P{cvars.pushback_dwell_time|int}
    G1 E-{cvars.retract_length} F{cvars.extruder_move_speed * 60}
    M400
  {% endif %}

  # Happy-Hare-shaped hook — fires right after cut/pushback, before the post-cut retract loop.
  _STANDALONE_POST_FORM_TIP

  RESPOND PREFIX="✂️" MSG="_CUT_UNLOAD_SEQUENCE: Cut done. Retracting until lower sensor clears..."
  {% for step in range(fvars.unload_retract_max_steps|int) %}
    _UNLOAD_RETRACT_STEP
  {% endfor %}
  # Sensor check must happen at execution time, not Jinja expansion time — separate macro
  # so its conditional evaluates after the retract loop above actually runs (same pattern
  # as LOAD_FILAMENT's _CHECK_LOWER_AFTER_FEED).
  _CHECK_LOWER_CLEAR_AFTER_UNLOAD PULLBACK={pullback}

  # Happy-Hare-shaped hook — fires after unload completes (lower sensor confirmed clear).
  _STANDALONE_POST_UNLOAD


[gcode_macro _UNLOAD_RETRACT_STEP]
description: Retract unload_retract_step mm if the lower sensor still detects filament.
  Called in a loop by _CUT_UNLOAD_SEQUENCE.
gcode:
  {% set fvars = printer["gcode_macro FILAMENT_VARS"] %}
  {% if printer['filament_switch_sensor filament_lower'].filament_detected %}
    G1 E-{fvars.unload_retract_step} F900
  {% endif %}


[gcode_macro _CHECK_LOWER_CLEAR_AFTER_UNLOAD]
description: Checks the lower sensor after _CUT_UNLOAD_SEQUENCE's retract loop. If clear,
  pulls back the extra fixed PULLBACK distance. If the sensor never cleared within
  unload_retract_max_steps, something's wrong (jam / stuck cut fragment / sensor fault) —
  errors instead of continuing to pull blind.
gcode:
  {% set fvars = printer["gcode_macro FILAMENT_VARS"] %}
  {% set pullback = params.PULLBACK|float %}
  {% if printer['filament_switch_sensor filament_lower'].filament_detected %}
    RESPOND TYPE=error MSG="_CUT_UNLOAD_SEQUENCE: Lower sensor still detects filament after {(fvars.unload_retract_max_steps * fvars.unload_retract_step)|int}mm retract. Check for a jam or stuck cut fragment."
    M400
  {% else %}
    RESPOND PREFIX="✂️" MSG="_CUT_UNLOAD_SEQUENCE: Lower sensor clear. Pulling back additional {pullback}mm."
    G1 E-{pullback} F600
    M400
  {% endif %}


# ─────────────────────────────────────────────────────────────────
# UNLOAD FILAMENT — ARCHIVED tip-form routines (2026-08-08)
# ─────────────────────────────────────────────────────────────────
#
# Superseded by the cut-based UNLOAD_FILAMENT / _UNLOAD_FILAMENT_SEQUENCE above. Kept for
# reference/rollback only — not called anywhere.

[gcode_macro _UNLOAD_FILAMENT_LEGACY_TIPFORM]
description: ARCHIVED 2026-08-08 — replaced by cut-based UNLOAD_FILAMENT. Not called anywhere.
  Formed a tip blob (E wiggle) then did a fixed 15mm + long-pull retract, no cutter involved.
gcode:
  {% set fvars = printer["gcode_macro FILAMENT_VARS"] %}
  {% set param_temp = params.TEMP|default(0)|int %}
  {% set distance = params.DISTANCE|default(105)|float %}

  {% if param_temp > 0 %}
    {% set target_temp = param_temp %}
  {% elif printer.extruder.target > 0 %}
    {% set target_temp = printer.extruder.target|int %}
  {% else %}
    {% set target_temp = fvars.extruder_temp %}
  {% endif %}

  RESPOND PREFIX="🧵" MSG="_UNLOAD_FILAMENT_LEGACY_TIPFORM: Heating to {target_temp}C"
  M109 S{target_temp}

  M400
  SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_state
  M82
  G92 E0

  RESPOND PREFIX="🧵" MSG="_UNLOAD_FILAMENT_LEGACY_TIPFORM: Tip forming"
  G1 E2 F1800
  G1 E0 F1800
  G1 E3 F1800
  G1 E0 F1800
  G1 E4 F1800
  G1 E0 F1800

  M83
  RESPOND PREFIX="🧵" MSG="_UNLOAD_FILAMENT_LEGACY_TIPFORM: Initial retract"
  G1 E-15 F900
  G4 P2000
  RESPOND PREFIX="🧵" MSG="_UNLOAD_FILAMENT_LEGACY_TIPFORM: Long pull -{distance}mm"
  G1 E-{distance} F600
  M400

  RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_state
  NOZZLE_LIGHTS_ON
  RESPOND PREFIX="✅" MSG="_UNLOAD_FILAMENT_LEGACY_TIPFORM: Done"


[gcode_macro _UNLOAD_FILAMENT_SEQUENCE_LEGACY_TIPFORM]
description: ARCHIVED 2026-08-08 — replaced by cut-based _UNLOAD_FILAMENT_SEQUENCE. Not
  called anywhere. Formed a tip blob (E wiggle) then did a fixed 15mm + 105mm long-pull
  retract, no cutter involved.
gcode:
  {% set fvars = printer["gcode_macro FILAMENT_VARS"] %}
  {% set target_temp = fvars.saved_extruder_temp if fvars.saved_extruder_temp > 0 else fvars.extruder_temp %}

  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=saved_fan_speed VALUE={printer.fan.speed}
  M107

  RESPOND PREFIX="🧵" MSG="_UNLOAD_FILAMENT_SEQUENCE_LEGACY_TIPFORM: Heating to {target_temp}C"
  M109 S{target_temp}
  _NOZZLE_LIGHTS_BRIGHT
  M400
  SAVE_GCODE_STATE NAME=UNLOAD_SEQ_state
  M82
  G92 E0

  G1 E2 F1800
  G1 E0 F1800
  G1 E3 F1800
  G1 E0 F1800
  G1 E4 F1800
  G1 E0 F1800

  M83
  G1 E-15 F900
  G4 P2000
  G1 E-105 F600
  M400

  RESTORE_GCODE_STATE NAME=UNLOAD_SEQ_state
  RESPOND PREFIX="✅" MSG="_UNLOAD_FILAMENT_SEQUENCE_LEGACY_TIPFORM: Filament unloaded."

  _FS_ENABLE_UPPER
  _FILAMENT_INSERT_PROMPT


[gcode_macro _FILAMENT_INSERT_PROMPT]
description: Shown after unload during mid-print change. User inserts filament and confirms.
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Filament Change"
  RESPOND TYPE=command MSG="action:prompt_text Filament unloaded. Insert new filament, then tap Load."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Load Filament|LOAD_FILAMENT"
  RESPOND TYPE=command MSG="action:prompt_button Cancel (stay paused)|_FILAMENT_CHANGE_CANCEL"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _FILAMENT_CHANGE_CANCEL]
description: User cancelled mid-print filament change. Print stays paused; sensors remain off.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND PREFIX="⚠️" MSG="Filament change cancelled. Print paused. Fix filament, then run LOAD_FILAMENT."


# ─────────────────────────────────────────────────────────────────
# SENSOR ENABLE / DISABLE
# ─────────────────────────────────────────────────────────────────

[gcode_macro SET_FILAMENT_AUTOLOAD]
description: Toggle auto-start of LOAD_FILAMENT on filament_upper insert while idle. ENABLE=1 to
  turn on, ENABLE=0 (or omitted) to turn off. One-shot — _INSERT_HANDLER clears it back off itself
  the moment it fires, so re-enable before each insert you want auto-started. Also resets to off on
  every Klipper restart. Only affects idle inserts — mid-print runout/CHANGE_FILAMENT flows are
  untouched either way.
gcode:
  {% set enable = params.ENABLE|default(0)|int %}
  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=autoload_enabled VALUE={True if enable == 1 else False}
  RESPOND PREFIX="🧵" MSG="Filament autoload on insert: {'ENABLED' if enable == 1 else 'disabled'}"

[gcode_macro _FS_ENABLE_ALL]
description: Enable both filament sensors
gcode:
  SET_FILAMENT_SENSOR SENSOR=filament_upper ENABLE=1
  SET_FILAMENT_SENSOR SENSOR=filament_lower ENABLE=1

[gcode_macro _FS_DISABLE_ALL]
description: Disable both filament sensors (during filament change to prevent spurious triggers)
gcode:
  SET_FILAMENT_SENSOR SENSOR=filament_upper ENABLE=0
  SET_FILAMENT_SENSOR SENSOR=filament_lower ENABLE=0

[gcode_macro COLD_PULL_START]
description: Disable both filament sensors before a manual cold pull, so insert/runout handlers
  don't fire while you're working the filament by hand. Heating and the pull itself are manual —
  run COLD_PULL_END when finished.
gcode:
  _FS_DISABLE_ALL
  RESPOND PREFIX="🧵" MSG="Filament sensors disabled for cold pull. Run COLD_PULL_END when finished."

[gcode_macro COLD_PULL_END]
description: Re-enable both filament sensors after a manual cold pull.
gcode:
  _FS_ENABLE_ALL
  RESPOND PREFIX="✅" MSG="Filament sensors re-enabled."

[gcode_macro _FS_ENABLE_UPPER]
description: Enable upper sensor only (detect filament insert after unload)
gcode:
  SET_FILAMENT_SENSOR SENSOR=filament_upper ENABLE=1

# Legacy aliases — kept for any existing callers
[gcode_macro _FS_ENABLE]
description: Enable lower filament sensor
gcode:
  SET_FILAMENT_SENSOR SENSOR=filament_lower ENABLE=1

[gcode_macro _FS_DISABLE]
description: Disable lower filament sensor
gcode:
  SET_FILAMENT_SENSOR SENSOR=filament_lower ENABLE=0


# ─────────────────────────────────────────────────────────────────
# SET_TEMP helper (retained for backward compat)
# ─────────────────────────────────────────────────────────────────

[gcode_macro SET_TEMP]
gcode:
  {% set HEATER = params.HEATER|default("")|string %}
  {% set TEMP = params.TEMP|default(0)|int %}
  {% set WAIT = params.WAIT|default(0)|int %}
  {% if HEATER == "extruder" %}
    {% if WAIT == 1 %}
      M109 S{TEMP}
    {% else %}
      M104 S{TEMP}
    {% endif %}
  {% else %}
    {% if WAIT == 1 %}
      M190 S{TEMP}
    {% else %}
      M140 S{TEMP}
    {% endif %}
  {% endif %}
