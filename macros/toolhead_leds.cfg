###############################################
# AntHead Nitehawk 36 RGB Status Macros
# Three NeoPixel GRBW on [neopixel _Toolhead] (renamed with leading underscore 2026-08-09
# to hide the raw whole-chain object from Mainsail's Miscellaneous panel — see printer.cfg)
# LED 1:   Status indicator — driven here via _SET_TH_LED/_STATUS_*
# LED 2+3: Nozzle lights — aliased as their own object by [virtual_leds nozzle_leds], see
#          hardware/virtual_leds.cfg. NOZZLE_LIGHTS_ON/OFF below write to it directly via
#          plain SET_LED LED=nozzle_leds (virtual_leds wires up the same stock led.py helper
#          as any native LED type, so this works exactly like addressing a real chain).
# _SET_TH_LED/_STATUS_OFF do NOT write to index 2-3 — index 1 and 2-3 are fully separate
# write paths (index 1 direct on _Toolhead, 2-3 only ever through nozzle_leds).
###############################################

[gcode_macro NOZZLE_LIGHTS_ON]
description: Turn on nozzle LEDs 2+3. Optional INTENSITY (0.0-1.0, default 0.25) and WARMTH
  (-1.0 cool .. 0 neutral .. 1.0 warm, default 0) params. Warmth is approximated on these
  GRBW LEDs by blending a little R (warm) or B (cool) on top of the W brightness base, since
  there's no true CCT/dual-white hardware here.
gcode:
    {% set intensity = params.INTENSITY|default(0.25)|float %}
    {% set warmth = params.WARMTH|default(0)|float %}
    {% set r = intensity * ([warmth, 0.0]|max) * 0.4 %}
    {% set b = intensity * ([-warmth, 0.0]|max) * 0.4 %}
    SET_LED LED=nozzle_leds RED={r} GREEN=0 BLUE={b} WHITE={intensity}

[gcode_macro NOZZLE_LIGHTS_OFF]
description: Turn off nozzle LEDs 2+3
gcode:
    SET_LED LED=nozzle_leds RED=0 GREEN=0 BLUE=0 WHITE=0

[gcode_macro _SET_TH_LED]
description: Set status LED (index 1) to given color. Index 2-3 (nozzle lights) are owned
  independently by the nozzle_lights led_effect (hardware/led_effects.cfg) — this macro does
  not touch them.
gcode:
    {% set r = params.R|default(0)|float %}
    {% set g = params.G|default(0)|float %}
    {% set b = params.B|default(0)|float %}
    {% set w = params.W|default(0)|float %}
    SET_LED LED=_Toolhead RED={r} GREEN={g} BLUE={b} WHITE={w} INDEX=1 SYNC=0 TRANSMIT=1

[gcode_macro _STATUS_OFF]
description: Turn off all toolhead LEDs (status + nozzle)
gcode:
    SET_LED LED=_Toolhead RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=1 SYNC=0 TRANSMIT=1
    SET_LED_EFFECT EFFECT=nozzle_lights STOP=1

[gcode_macro _STATUS_READY]
description: Idle/ready - green
gcode:
    _SET_TH_LED R=0 G=0.5 B=0 W=0

[gcode_macro _STATUS_BUSY]
description: Busy/processing - orange
gcode:
    _SET_TH_LED R=0.8 G=0.3 B=0 W=0

[gcode_macro _STATUS_HEATING]
description: Heating hotend - red
gcode:
    _SET_TH_LED R=1.0 G=0 B=0 W=0

[gcode_macro _STATUS_HOMING]
description: Homing axes - blue
gcode:
    _SET_TH_LED R=0 G=0 B=1.0 W=0

[gcode_macro _STATUS_LEVELING]
description: QGL in progress - yellow
gcode:
    _SET_TH_LED R=0.8 G=0.8 B=0 W=0

[gcode_macro _STATUS_MESHING]
description: Bed mesh in progress - cyan
gcode:
    _SET_TH_LED R=0 G=0.8 B=0.8 W=0

[gcode_macro _STATUS_CLEANING]
description: Nozzle clean/purge - purple
gcode:
    _SET_TH_LED R=0.5 G=0 B=0.5 W=0

[gcode_macro _STATUS_PRINTING]
description: Printing - white at reduced brightness
gcode:
    _SET_TH_LED R=0 G=0 B=0 W=0.4

[gcode_macro _STATUS_PART_READY]
description: Print complete - solid green
gcode:
    _SET_TH_LED R=0 G=1.0 B=0 W=0
