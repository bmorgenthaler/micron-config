# Wraps KAMP's adaptive LINE_PURGE (symlinked from
# ~/Klipper-Adaptive-Meshing-Purging/Configuration/Line_Purge.cfg via the KAMP/ symlink and
# included through KAMP_Settings.cfg) to keep its computed purge position clear of the crossbow
# cutter, which physically sits in the same bed-origin corner (X2-10/Y1-16, per
# _CROSSBOW_CUT_VARS' safe_x/pin_x/cut_x and safe_y/pin_y/cut_y) that KAMP's own math falls back
# to whenever a print has no EXCLUDE_OBJECT_DEFINE data — purge_x/y_min/max all default to 0,
# and KAMP's own origin clamp floors at 0 too, landing the purge line directly in the cutter's
# footprint.
#
# Confirmed live 2026-08-20: a test print with no exclude_object data (PrusaSlicer's "Label
# objects" isn't enabled in this pipeline, so this isn't a one-off — every print through
# LINE_PURGE currently hits this same fallback) purged straight at the cutter, causing extruder
# clicking and visible cutter-arm movement.
#
# This file must load AFTER KAMP_Settings.cfg (see printer.cfg's explicit include placement) so
# rename_existing captures KAMP's real LINE_PURGE, not something earlier.

[gcode_macro LINE_PURGE]
rename_existing: _KAMP_LINE_PURGE
description: Safety wrapper around KAMP's LINE_PURGE — redirects the purge through BLOBIFIER
  instead when KAMP's computed position would land inside the crossbow cutter's keep-out zone.
gcode:
  # Replicates just the position-determining subset of Line_Purge.cfg's own math (same file,
  # lines ~26-37) — enough to know where it WOULD purge, without duplicating the actual motion.
  {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
  {% set purge_x_min = (all_points | map(attribute=0) | min | default(0)) %}
  {% set purge_y_min = (all_points | map(attribute=1) | min | default(0)) %}
  {% set purge_margin = printer["gcode_macro _KAMP_Settings"].purge_margin | float %}
  {% set purge_x_origin = ([purge_x_min - purge_margin, 0] | max) %}
  {% set purge_y_origin = ([purge_y_min - purge_margin, 0] | max) %}

  # Crossbow cutter keep-out — a generous round-number estimate around the cutter's configured
  # coordinates (max 10 in X, max 16 in Y across safe_x/pin_x/cut_x and safe_y/pin_y/cut_y), NOT
  # a measured physical clearance. Tighten once the real hardware footprint is measured.
  {% set keepout_x = 25 %}
  {% set keepout_y = 25 %}

  {% if purge_x_origin < keepout_x and purge_y_origin < keepout_y %}
    RESPOND TYPE=error MSG="LINE_PURGE: KAMP's computed purge position (X{purge_x_origin} Y{purge_y_origin}) falls inside the crossbow cutter's keep-out zone -- likely missing EXCLUDE_OBJECT_DEFINE data in this gcode file (check PrusaSlicer's 'Label objects' setting). Routing purge through BLOBIFIER instead."
    {% set purge_amount = printer["gcode_macro _KAMP_Settings"].purge_amount | float %}
    BLOBIFIER PURGE_LENGTH={purge_amount}
  {% else %}
    _KAMP_LINE_PURGE
  {% endif %}
