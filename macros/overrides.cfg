[gcode_macro UNSAFE_RAISE_Z]
description: Raise Z axis 25mm without homing
gcode:
    G90
    SET_KINEMATIC_POSITION Z=0
    G0 Z25 F600
    M84


[gcode_macro _CLIENT_VARIABLE]
description: Mainsail client vars. Only user_cancel_macro is set; every other key keeps
  mainsail.cfg's built-in default (park_at_cancel etc. unchanged).
variable_user_cancel_macro: "_CANCEL_CLEANUP"
gcode:

[gcode_macro _CANCEL_CLEANUP]
description: Called by mainsail.cfg's CANCEL_PRINT (via user_cancel_macro) after park/retract/
  heaters-off, before CANCEL_PRINT_BASE. Mirrors PRINT_END's transform resets, which a cancel
  otherwise skips. Added 2026-11-06: a leftover adaptive mesh made the next G28 fail with
  "Must home axis first" (see PRINT_START's BED_MESH_CLEAR note). Non-motion commands only.
gcode:
  BED_MESH_CLEAR
  SET_SKEW CLEAR=1
  SET_GCODE_OFFSET Z=0
  PS_ABORT_DISARM   # clear PRINT_START fast-cancel state (klippy_extras/print_start_abort.py)

# NOTE (2026-11-06): the CANCEL_PRINT section below is DEAD — mainsail.cfg's same-named
# [gcode_macro CANCEL_PRINT] loads later and merges over it (_CANCEL_PRINT_TRUE_BASE never
# appears in klippy.log's config dump). Its filament-state reset does not run. Use
# _CANCEL_CLEANUP above for anything that must run on cancel.
[gcode_macro CANCEL_PRINT]
description: Wraps CANCEL_PRINT to reset FILAMENT_VARS mid-print-change state. Fixes a
  2026-08-09 live bug: a print cancelled while paused for a runout/CHANGE_FILAMENT left
  mid_print_change (and saved_extruder_temp/saved_fan_speed/unlimited_purge/
  current_purge_retries) stuck True/non-zero. The next completely unrelated idle
  LOAD_FILAMENT then read that stale flag and _LOAD_FILAMENT_DONE routed it into the
  mid-print clean+resume chain (_MIDPRINT_RESUME_PROMPT -> _MIDPRINT_CLEAN_AND_RESUME),
  which tried to CLEAN_NOZZLE and RESUME on a system that was neither homed nor
  actually printing. See _LOAD_FILAMENT_DONE's own added guard (macros/filament.cfg) for
  the second, defense-in-depth half of this fix — that guard now also requires
  print_stats.state == "paused" before taking the mid-print branch, so this reset isn't
  the only thing standing between a stale flag and a bad resume.
  Load-order note: macros/*.cfg (this file included) loads before mainsail.cfg
  (printer.cfg [include] order), so this definition runs FIRST and captures the true
  built-in CANCEL_PRINT (from klippy/extras/pause_resume.py) as
  _CANCEL_PRINT_TRUE_BASE. mainsail.cfg's own [gcode_macro CANCEL_PRINT] loads after,
  renames the CANCEL_PRINT that's current at that point (this macro) to its own
  CANCEL_PRINT_BASE, and becomes the final CANCEL_PRINT. Net effect: mainsail's
  park/retract/turn-off-heaters sequence runs first (as before), then this macro runs
  last (as CANCEL_PRINT_BASE) to reset filament state and re-enable both sensors before
  finally calling the true built-in for the actual cancel/state-clear.
rename_existing: _CANCEL_PRINT_TRUE_BASE
gcode:
  {% if printer["gcode_macro FILAMENT_VARS"].mid_print_change %}
    RESPOND PREFIX="🧵" MSG="CANCEL_PRINT: Clearing stale mid-print filament-change state."
  {% endif %}
  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=mid_print_change VALUE=False
  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=saved_extruder_temp VALUE=0
  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=saved_fan_speed VALUE=0
  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=unlimited_purge VALUE=False
  SET_GCODE_VARIABLE MACRO=FILAMENT_VARS VARIABLE=current_purge_retries VALUE=0
  _FS_ENABLE_ALL
  _CANCEL_PRINT_TRUE_BASE
