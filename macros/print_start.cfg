##########################################
# PRINT_START macro for Micron R1 — STAGED (2026-11-08)
#
# WHY STAGED: Klipper holds the gcode mutex for a macro's ENTIRE script (nested macro
# calls included), so a CANCEL_PRINT from Mainsail can't run until the whole macro
# returns. virtual_sdcard, however, checks gcode_mutex.test() BETWEEN FILE LINES and
# yields to a pending request there. So the only way to make cancel responsive is to put
# each blocking stage on its OWN LINE of the sliced file. Sub-macros called from inside
# PRINT_START would not help. Before this, a cancel requested during PRINT_START waited
# for heat + soak + clean + QGL + mesh (10 min on 2026-11-08, up to 20 min on ASA).
#
# Worst-case cancel latency is now the longest single stage: a 30s _PS_WAIT chunk, or one
# of the M109 heat-ups / CLEAN_NOZZLE / QGL / mesh (each ~1-2 min at most).
#
# PrusaSlicer start gcode (STAGED — paste exactly; the _PS_WAIT block is 36 lines = 18 min
# of 30s chunks — a cold 110C bed ramp (~4 min) + 10 min mat soak + phase transitions is
# ~30, leaving a little for chamber catch-up. Extra _PS_WAIT lines
# no-op instantly once the soak is done; anything they don't cover, _PS_SOAK_DONE
# finishes in one blocking step, so the line count only affects responsiveness, never
# correctness):
#
# M104 S0
# M140 S0
# PRINT_START STAGED=1 EXTRUDER=[first_layer_temperature[initial_extruder]] BED=[first_layer_bed_temperature] CHAMBER=[chamber_temperature] MATERIAL={filament_type[initial_extruder]}
# _PS_HOME
# _PS_HEAT_BED
# _PS_WAIT   (x36 — one per line)
# _PS_SOAK_DONE
# _PS_HEAT_CLEAN
# _PS_CLEAN
# _PS_COOL
# _PS_CONTACT_CAL
# _PS_QGL
# _PS_MESH
# _PS_CONTACT_FINAL
# _PS_HEAT_PRINT
# _PS_PURGE
#
# LEGACY: files sliced before 2026-11-08 call PRINT_START without STAGED=1. PRINT_START
# then runs every stage itself (identical sequence, old slow-cancel behaviour), so old
# gcode and RESTART_LAST_PRINT on old files still print correctly.
#
# OrcaSlicer: same block, with EXTRUDER=[first_layer_temperature].
##########################################
# macros/print_start.cfg

[gcode_macro _PS_VARS]
description: Internal — state shared between PRINT_START and its _PS_* stage macros.
  active gates every stage (False = stage no-ops), so a stray stage line can't move the
  printer outside a real PRINT_START. Cleared by _PS_PURGE (start done) and by
  _CANCEL_CLEANUP (macros/overrides.cfg) on cancel.
  phase drives the _PS_WAIT state machine: ramp -> soak -> chamber -> done.
  soak_until is in printer.toolhead.estimated_print_time seconds (MCU clock, real time).
variable_active:          False
variable_target_bed:      0
variable_target_extruder: 0
variable_target_chamber:  0
variable_clean_temp:      150
variable_skip_soak:       False
variable_phase:           ""
variable_soak_until:      0.0
variable_wait_chunk:      30
gcode:


[gcode_macro PRINT_START_STAGED]
description: Setup half of the staged start — params into _PS_VARS, filament guard, instant
  setup. ONLY for the full staged slicer block (the _PS_* lines must follow it in the file).
  Never runs stages itself. Use PRINT_START for anything else.
gcode:
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("0")|int %}
  {% set clean_temp = [target_extruder * 0.85, 150]|max|int %}
  {% set material = params.MATERIAL|default("PLA")|string|upper %}
  {% set lower = printer['filament_switch_sensor filament_lower'].filament_detected %}
  {% set upper = printer['filament_switch_sensor filament_upper'].filament_detected %}
  {% set bed_hot = printer.heater_bed.temperature >= (target_bed - 10) %}
  # Chamber heating is already non-blocking/concurrent (_CHAMBER_HEATSOAK_START/_WAIT),
  # so it doesn't need to gate the soak/dwell skip — only whether the bed/mat are already
  # hot matters. Previously also required target_chamber==0, which meant skip_soak never
  # fired on chamber-heated ASA prints (CHAMBER=45) — the exact case this was meant to help.
  # Fixed 2026-08-13, day after wiring skip_soak into the >90C branch (2026-08-12).
  # Captured HERE (at PRINT_START time, bed not yet commanded), same as before staging.
  {% set skip_soak = bed_hot %}

  # ─── Filament guard — must be inline Jinja so the else-branch is never queued ───
  {% if not lower %}
    SET_GCODE_VARIABLE MACRO=_PS_VARS VARIABLE=active VALUE=False
    {% if not upper %}
      RESPOND TYPE=error MSG="PRINT_START: No filament at either sensor — cancelling, prompting to load."
      { action_call_remote_method("notify",
          name="gcode_pushover",
          title="🚫 No Filament",
          message="Print cancelled — no filament detected at either sensor. Load filament, then RESTART_LAST_PRINT.") }
    {% else %}
      RESPOND TYPE=error MSG="PRINT_START: Filament at upper sensor but not fed to hotend — cancelling, prompting to load."
      { action_call_remote_method("notify",
          name="gcode_pushover",
          title="🚫 Filament Not Loaded",
          message="Print cancelled — filament present but not fed to hotend. Load filament, then RESTART_LAST_PRINT.") }
    {% endif %}
    # Save filename + target temp BEFORE cancelling — Jinja substitutes {printer...} at
    # template-render time (before CANCEL_PRINT physically runs), so this captures the live
    # values, not whatever CANCEL_PRINT leaves behind (it TURN_OFF_HEATERS, zeroing
    # extruder.target). See _PRINT_START_RETRY_VARS / RESTART_LAST_PRINT below.
    SET_GCODE_VARIABLE MACRO=_PRINT_START_RETRY_VARS VARIABLE=filename VALUE="'{printer.print_stats.filename}'"
    SET_GCODE_VARIABLE MACRO=_PRINT_START_RETRY_VARS VARIABLE=extruder_temp VALUE={target_extruder}
    # CANCEL_PRINT (not PAUSE) deliberately — nothing is homed yet at this point (G28 hasn't
    # run), and Mainsail's standard PAUSE+RESUME would leave a live "Resume" button in the UI
    # that resumes virtual_sdcard straight into the print body, skipping homing/heatsoak/QGL/
    # mesh entirely if pressed. Cancelling means there's no such footgun sitting around — the
    # only way back in is the explicit RESTART_LAST_PRINT below, which always re-runs the full
    # sliced file (and therefore a full fresh PRINT_START) from the top via SDCARD_PRINT_FILE.
    # On a STAGED file the cancel stops virtual_sdcard before it reads the _PS_* lines; they
    # would also no-op anyway since active=False.
    CANCEL_PRINT
    _PRINT_START_FILAMENT_PROMPT

  {% else %}

    # ─── Instant setup only — nothing in here blocks ───
    SET_GCODE_VARIABLE MACRO=_PS_VARS VARIABLE=target_bed VALUE={target_bed}
    SET_GCODE_VARIABLE MACRO=_PS_VARS VARIABLE=target_extruder VALUE={target_extruder}
    SET_GCODE_VARIABLE MACRO=_PS_VARS VARIABLE=target_chamber VALUE={target_chamber}
    SET_GCODE_VARIABLE MACRO=_PS_VARS VARIABLE=clean_temp VALUE={clean_temp}
    SET_GCODE_VARIABLE MACRO=_PS_VARS VARIABLE=skip_soak VALUE={skip_soak}
    SET_GCODE_VARIABLE MACRO=_PS_VARS VARIABLE=phase VALUE="''"
    SET_GCODE_VARIABLE MACRO=_PS_VARS VARIABLE=soak_until VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_PS_VARS VARIABLE=active VALUE=True

    # PRINT_END has no MATERIAL param of its own — see _PRINT_END_CLEAN in print_end.cfg
    SET_GCODE_VARIABLE MACRO=_PRINT_END_CLEAN VARIABLE=material VALUE="'{material}'"

    SET_GCODE_OFFSET Z=0
    SKEW_PROFILE LOAD=Califlower
    CLEAR_PAUSE
    SET_LED LED=Chamber WHITE=0.5
    NOZZLE_LIGHTS_ON

  {% endif %}


[gcode_macro PRINT_START]
description: Full start-up in one command — PRINT_START_STAGED setup, then every _PS_* stage
  inline. ALWAYS safe on its own line, whatever params it gets (a STAGED=1 param is ignored;
  2026-11-08 incident: STAGED=1 on this line without the _PS_* lines skipped homing and the
  print body hit "Must home axis first"). Cancel only lands after the whole start finishes.
  For fast cancel, use the staged slicer block instead (slicer/prusaslicer_start_gcode_staged.txt).
gcode:
  PRINT_START_STAGED {rawparams}
  _PS_HOME
  _PS_HEAT_BED
  _PS_SOAK_DONE
  _PS_HEAT_CLEAN
  _PS_CLEAN
  _PS_COOL
  _PS_CONTACT_CAL
  _PS_QGL
  _PS_MESH
  _PS_CONTACT_FINAL
  _PS_HEAT_PRINT
  _PS_PURGE

[gcode_macro _PS_GUARD]
description: Internal — error message only. Each stage does its own inline `{% if ps.active %}`
  check and calls this when it skips.
gcode:
  RESPOND TYPE=error MSG="{params.STAGE|default('_PS stage')}: no active PRINT_START — skipped."


[gcode_macro _PS_HOME]
description: PRINT_START stage — clear mesh, home all.
gcode:
  {% set ps = printer["gcode_macro _PS_VARS"] %}
  {% if ps.active %}
    _STATUS_HOMING
    # BED_MESH_CLEAR must come BEFORE G28 (moved 2026-11-06). A mesh left loaded by a
    # cancelled print (CANCEL_PRINT never runs PRINT_END's BED_MESH_CLEAR) stays in the
    # gcode_move transform chain during homing. With Z unhomed, beacon's z-hop sets Z raw;
    # _HOME_POST_AXIS's X recentre then goes through bed_mesh.move, which re-adds the mesh
    # Z-adjust at the new XY -> a few-um Z delta on an unhomed axis -> "Must home axis
    # first: 90.000 14.623 5.003" and G28 aborts with homed_axes stuck at "x".
    BED_MESH_CLEAR
    G28
    G90
  {% else %}
    _PS_GUARD STAGE=_PS_HOME
  {% endif %}


[gcode_macro _PS_HEAT_BED]
description: PRINT_START stage — start the bed heating (non-blocking) and arm the _PS_WAIT
  state machine. The actual wait happens in _PS_WAIT chunks / _PS_SOAK_DONE.
gcode:
  {% set ps = printer["gcode_macro _PS_VARS"] %}
  {% if ps.active %}
    RESPOND MSG="Bed: {ps.target_bed}c"
    _STATUS_HEATING
    {% if ps.target_bed > 90 %}
      M106 S255
      SET_FAN_SPEED FAN=filter SPEED=1   # explicit on — TOGGLE_FILTER would flip it OFF if a
                                          # prior print's air cycle left it running into this one
    {% endif %}
    G0 Z15 F9000
    # Bed ramps alone — nozzle pre-warm and chamber heat are staggered until the plate
    # reaches target (_PS_BED_REACHED). Staggered 2026-09-23: bed + hotend (M104 S120) +
    # chamber fans all at 100% duty together peaked the CyberPower SL750 UPS at 108% load.
    M140 S{ps.target_bed}
    SET_GCODE_VARIABLE MACRO=_PS_VARS VARIABLE=phase VALUE="'ramp'"
  {% else %}
    _PS_GUARD STAGE=_PS_HEAT_BED
  {% endif %}


[gcode_macro _PS_BED_REACHED]
description: Internal — ramp -> soak transition, run exactly once when the plate reaches
  target (from a _PS_WAIT chunk or from _PS_SOAK_DONE). Pre-warms the nozzle, starts chamber
  heat (>90C, non-blocking), and arms the soak timer unless skip_soak.
gcode:
  {% set ps = printer["gcode_macro _PS_VARS"] %}
  {% set now = printer.toolhead.estimated_print_time %}
  {% if ps.target_bed <= 90 %}
    M190 S{ps.target_bed}   # finish to Klipper's own M190 tolerance (already within 2C)
  {% endif %}
  M104 S120                 # Pre-warm nozzle during soak, no ooze risk
  {% if ps.target_bed > 90 %}
    # Chamber heat starts here (non-blocking) so it runs concurrently with the mat-soak
    # dwell. Confirmed live 2026-08-08: chamber alone took ~9.8min to reach 55C.
    _CHAMBER_HEATSOAK_START CHAMBER_TEMP={ps.target_chamber}
  {% endif %}
  # Plate (heater_bed) hits target ~4min in, but the mat (bed_inner) is still ~25C behind and
  # takes ~13-15min more to converge (measured 2026-07-11, bed=110C). 10 min dwell >90C,
  # 5 min otherwise. Skipped when the bed was already hot at print start (skip_soak) —
  # back-to-back prints don't pay it again. See project_print_start_skip_soak_fix memory.
  {% set dwell = 600 if ps.target_bed > 90 else 300 %}
  {% if ps.skip_soak %}
    RESPOND MSG="Bed already at temp — skipping {(dwell / 60)|int} min soak."
    SET_GCODE_VARIABLE MACRO=_PS_VARS VARIABLE=soak_until VALUE=0.0
  {% else %}
    RESPOND MSG="Soak for {(dwell / 60)|int} min (cancel-responsive, {ps.wait_chunk}s chunks)"
    SET_GCODE_VARIABLE MACRO=_PS_VARS VARIABLE=soak_until VALUE={now + dwell}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_PS_VARS VARIABLE=phase VALUE="'soak'"


[gcode_macro _PS_WAIT]
description: PRINT_START stage — ONE bounded chunk (<= wait_chunk s) of the bed-ramp /
  soak / chamber wait. Emitted many times in a row by the slicer; each line is a separate
  file line, so a pending CANCEL_PRINT lands between chunks. No-ops instantly once
  phase == done (or outside a PRINT_START), so surplus lines cost nothing.
gcode:
  {% set ps = printer["gcode_macro _PS_VARS"] %}
  {% set chunk = ps.wait_chunk|float %}
  {% set now = printer.toolhead.estimated_print_time %}
  {% if ps.active %}
    {% if ps.phase == "ramp" %}
      {% if printer.heater_bed.temperature >= ps.target_bed - 2 %}
        _PS_BED_REACHED
      {% else %}
        G4 P{(chunk * 1000)|int}
      {% endif %}
    {% elif ps.phase == "soak" %}
      {% set remaining = ps.soak_until - now %}
      {% if remaining > 0 %}
        G4 P{([remaining, chunk]|min * 1000)|int}
      {% else %}
        SET_GCODE_VARIABLE MACRO=_PS_VARS VARIABLE=phase VALUE="{"'chamber'" if ps.target_bed > 90 else "'done'"}"
      {% endif %}
    {% elif ps.phase == "chamber" %}
      {% if ps.target_chamber > 0 and printer["heater_generic chamber"].temperature < ps.target_chamber - 0.1 %}
        G4 P{(chunk * 1000)|int}
      {% else %}
        _CHAMBER_HEATSOAK_WAIT CHAMBER_TEMP={ps.target_chamber}   # sets exact target, no wait left
        SET_GCODE_VARIABLE MACRO=_PS_VARS VARIABLE=phase VALUE="'done'"
      {% endif %}
    {% endif %}
  {% endif %}


[gcode_macro _PS_SOAK_DONE]
description: PRINT_START stage — blocking finisher for whatever the _PS_WAIT chunks didn't
  cover (all of it on a legacy call). Each child is expanded only after the previous one
  ran, so they see the phase it left behind.
gcode:
  {% set ps = printer["gcode_macro _PS_VARS"] %}
  {% if ps.active %}
    _PS_SOAK_DONE_RAMP
    _PS_SOAK_DONE_DWELL
    _PS_SOAK_DONE_CHAMBER
  {% else %}
    _PS_GUARD STAGE=_PS_SOAK_DONE
  {% endif %}

[gcode_macro _PS_SOAK_DONE_RAMP]
gcode:
  {% set ps = printer["gcode_macro _PS_VARS"] %}
  {% if ps.phase == "ramp" %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={ps.target_bed - 2}
    _PS_BED_REACHED
  {% endif %}

[gcode_macro _PS_SOAK_DONE_DWELL]
gcode:
  {% set ps = printer["gcode_macro _PS_VARS"] %}
  {% set remaining = ps.soak_until - printer.toolhead.estimated_print_time %}
  {% if ps.phase == "soak" and remaining > 0 %}
    G4 P{(remaining * 1000)|int}
  {% endif %}

[gcode_macro _PS_SOAK_DONE_CHAMBER]
gcode:
  {% set ps = printer["gcode_macro _PS_VARS"] %}
  {% if ps.target_bed > 90 %}
    # Catch up on chamber if it hasn't reached target yet (idempotent if already there).
    _CHAMBER_HEATSOAK_WAIT CHAMBER_TEMP={ps.target_chamber}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_PS_VARS VARIABLE=phase VALUE="'done'"


[gcode_macro _PS_HEAT_CLEAN]
description: PRINT_START stage — heat to cleaning temp (85% of print temp, min 150).
gcode:
  {% set ps = printer["gcode_macro _PS_VARS"] %}
  {% if ps.active %}
    RESPOND MSG="Hotend: {ps.clean_temp}c for cleaning"
    _STATUS_HEATING
    M109 S{ps.clean_temp}
  {% else %}
    _PS_GUARD STAGE=_PS_HEAT_CLEAN
  {% endif %}


[gcode_macro _PS_CLEAN]
description: PRINT_START stage — brush the nozzle, then move off the brush.
gcode:
  {% set ps = printer["gcode_macro _PS_VARS"] %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
  {% if ps.active %}
    _STATUS_CLEANING
    CLEAN_NOZZLE
    # Move away from brush/bucket before fan-assisted cooldown
    G1 X{x_wait} Y{y_wait} Z15 F9000
  {% else %}
    _PS_GUARD STAGE=_PS_CLEAN
  {% endif %}


[gcode_macro _PS_COOL]
description: PRINT_START stage — fan-assisted cooldown to <=155C for Beacon contact.
gcode:
  {% set ps = printer["gcode_macro _PS_VARS"] %}
  {% if ps.active %}
    RESPOND MSG="Cooling for contact calibration"
    M104 S150
    M106 S255                                             # PCF assists cooldown
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=155
    M106 S0
  {% else %}
    _PS_GUARD STAGE=_PS_COOL
  {% endif %}


[gcode_macro _PS_CONTACT_CAL]
description: PRINT_START stage — Beacon contact Z + rebuild proximity model.
gcode:
  {% set ps = printer["gcode_macro _PS_VARS"] %}
  {% if ps.active %}
    G28 Z METHOD=CONTACT CALIBRATE=1                      # Calibrate z offset and beacon model
  {% else %}
    _PS_GUARD STAGE=_PS_CONTACT_CAL
  {% endif %}


[gcode_macro _PS_QGL]
description: PRINT_START stage — quad gantry level.
gcode:
  {% set ps = printer["gcode_macro _PS_VARS"] %}
  {% if ps.active %}
    RESPOND MSG="Leveling"
    _STATUS_LEVELING
    QUAD_GANTRY_LEVEL
  {% else %}
    _PS_GUARD STAGE=_PS_QGL
  {% endif %}


[gcode_macro _PS_MESH]
description: PRINT_START stage — adaptive bed mesh.
gcode:
  {% set ps = printer["gcode_macro _PS_VARS"] %}
  {% if ps.active %}
    RESPOND MSG="Bed mesh"
    _STATUS_MESHING
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=5
  {% else %}
    _PS_GUARD STAGE=_PS_MESH
  {% endif %}


[gcode_macro _PS_CONTACT_FINAL]
description: PRINT_START stage — final contact Z offset with hot-ish nozzle.
gcode:
  {% set ps = printer["gcode_macro _PS_VARS"] %}
  {% if ps.active %}
    G28 Z METHOD=CONTACT CALIBRATE=0                      # Final z offset with hot nozzle
  {% else %}
    _PS_GUARD STAGE=_PS_CONTACT_FINAL
  {% endif %}


[gcode_macro _PS_HEAT_PRINT]
description: PRINT_START stage — heat to print temp, apply Beacon thermal-expansion offset.
gcode:
  {% set ps = printer["gcode_macro _PS_VARS"] %}
  {% if ps.active %}
    RESPOND MSG="Hotend: {ps.target_extruder}c"
    _STATUS_HEATING
    G0 Z15 F9000
    M107
    M109 S{ps.target_extruder}
    # Apply Beacon nozzle thermal expansion compensation
    # Requires BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET to have been run once
    _BEACON_SET_NOZZLE_TEMP_OFFSET
  {% else %}
    _PS_GUARD STAGE=_PS_HEAT_PRINT
  {% endif %}


[gcode_macro _PS_PURGE]
description: PRINT_START stage — fixed front-edge prime line, then marks PRINT_START done.
gcode:
  {% set ps = printer["gcode_macro _PS_VARS"] %}
  {% if ps.active %}
    {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
    _STATUS_PRINTING

    # ─── Prime / purge line — fixed front-edge location ──────────────────────────────
    # Replaces KAMP's adaptive LINE_PURGE (KAMP disabled 2026-08-27, see printer.cfg).
    # Mimics KAMP LINE_PURGE's motion — ~10mm tip prime, then a short 1:1 "fat" bead at
    # 0.8mm nozzle height, retract, a rapid dash to snap the string, then a Z-hop — but
    # at a fixed spot ahead of the print area (the old commented-out prime-line location)
    # instead of adaptively beside the first object. Needs no exclude_object data and
    # stays well clear of the crossbow cutter (X2-10 / Y1-16). Tunables below: lower
    # purge_height for a fatter / more-squished bead, raise purge_amount for more prime.
    {% set purge_x_start = x_wait - 50 %}              # X33 here — matches the old prime line
    {% set purge_y       = 4 %}                        # mm off the front edge (mesh_min Y is 21.2)
    {% set purge_height  = 0.8 %}                      # nozzle Z during the bead (KAMP default)
    {% set purge_length  = 30 %}                       # mm of X the bead is drawn over (KAMP: 30)
    {% set purge_amount  = 30 %}                       # mm of filament in the bead   (KAMP default)
    {% set tip_distance  = 10 %}                       # mm tip prime before the bead (KAMP default)
    {% set flow_rate     = 12 %}                       # mm3/s target                 (KAMP default)
    {% set purge_speed   = (flow_rate / 5.0) * 60 %}   # KAMP's purge feedrate formula -> F144
    {% set travel_speed  = printer.toolhead.max_velocity * 60 %}

    RESPOND MSG="Purge: {purge_amount}mm bead at X{purge_x_start} Y{purge_y}, {flow_rate}mm3/s"
    SAVE_GCODE_STATE NAME=prime_purge_state
    G90                                                        # absolute XYZ
    G0 X{purge_x_start} Y{purge_y} F{travel_speed}
    G0 Z{purge_height} F{travel_speed}
    M83                                                        # relative extrusion
    G92 E0
    G1 E{tip_distance} F{purge_speed}                          # prime the tip
    G1 X{purge_x_start + purge_length} E{purge_amount} F{purge_speed}   # short fat 1:1 bead
    G1 E-0.5 F2100                                             # retract
    G0 X{purge_x_start + purge_length + 10} F{travel_speed}    # dash to snap the string
    G92 E0
    M82                                                        # back to absolute extrusion
    G0 Z{purge_height * 2} F{travel_speed}                     # Z-hop clear of the bead
    M400                                                       # finish moves before state restore
    RESTORE_GCODE_STATE NAME=prime_purge_state

    SET_GCODE_VARIABLE MACRO=_PS_VARS VARIABLE=active VALUE=False
  {% else %}
    _PS_GUARD STAGE=_PS_PURGE
  {% endif %}


# ─────────────────────────────────────────────────────────────────
# Filament-missing recovery — prompt instead of a silent cancel-and-forget
# ─────────────────────────────────────────────────────────────────
# See PRINT_START's filament guard above for the full reasoning on why this cancels
# (rather than pauses) before prompting. Deliberately does not touch macros/filament.cfg's
# LOAD_FILAMENT/_LOAD_FILAMENT_DONE chain — that chain is shared by idle loads, mid-print
# reloads, and splices, all already live-validated; grafting a "then also restart the print"
# branch onto its shared completion macro would risk all of those. Instead this stays fully
# self-contained: LOAD_FILAMENT runs completely standard (ends at its own normal idle-load
# completion), and restarting the print is one explicit extra step (RESTART_LAST_PRINT) —
# same "manual checkpoint before doing the consequential thing" pattern as
# _MIDPRINT_RESUME_PROMPT in filament.cfg.

[gcode_macro _PRINT_START_RETRY_VARS]
description: Internal — set by PRINT_START's filament guard right before it cancels a print
  for missing/unfed filament. filename lets RESTART_LAST_PRINT restart the same file;
  extruder_temp lets the Load Filament prompt button heat to the print's actual target temp
  instead of FILAMENT_VARS' generic 230C fallback (CANCEL_PRINT's TURN_OFF_HEATERS zeroes
  extruder.target, so LOAD_FILAMENT can no longer infer it on its own by that point).
variable_filename:       ""
variable_extruder_temp:   0
gcode:


[gcode_macro _PRINT_START_FILAMENT_PROMPT]
description: Shown when PRINT_START's filament guard cancels for missing/not-fed filament.
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Filament Not Loaded"
  RESPOND TYPE=command MSG="action:prompt_text Print cancelled — filament isn't loaded. Load it, confirm the purge looks good, then run RESTART_LAST_PRINT to start over."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Load Filament|_PRINT_START_LOAD_FILAMENT"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_footer_button Dismiss|RESPOND TYPE=command MSG=action:prompt_end|info"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _PRINT_START_LOAD_FILAMENT]
description: Internal — Load Filament button target from _PRINT_START_FILAMENT_PROMPT. Just
  LOAD_FILAMENT (fully standard, own purge-confirm prompt) with TEMP pinned to the cancelled
  print's actual target_extruder instead of LOAD_FILAMENT's generic fallback — purely so the
  purge check happens near the temp that's about to be used anyway, not a correctness
  requirement (RESTART_LAST_PRINT's fresh PRINT_START reheats properly regardless).
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  {% set rvars = printer["gcode_macro _PRINT_START_RETRY_VARS"] %}
  LOAD_FILAMENT TEMP={rvars.extruder_temp}


[gcode_macro RESTART_LAST_PRINT]
description: Restarts the print PRINT_START's filament guard just cancelled (see
  _PRINT_START_RETRY_VARS). Run after LOAD_FILAMENT confirms a good purge. Uses stock
  SDCARD_PRINT_FILE, which re-executes the sliced file from the top, including its slicer
  start gcode — so this is a completely normal, full PRINT_START run (home, heatsoak, QGL,
  mesh, all of it), not a resume of any kind.
gcode:
  {% set fname = printer["gcode_macro _PRINT_START_RETRY_VARS"].filename %}
  {% if fname == "" %}
    RESPOND TYPE=error MSG="RESTART_LAST_PRINT: No cancelled print on file — nothing to restart."
  {% else %}
    RESPOND PREFIX="🧵" MSG="Restarting {fname}..."
    SET_GCODE_VARIABLE MACRO=_PRINT_START_RETRY_VARS VARIABLE=filename VALUE="''"
    SET_GCODE_VARIABLE MACRO=_PRINT_START_RETRY_VARS VARIABLE=extruder_temp VALUE=0
    SDCARD_PRINT_FILE FILENAME={fname}
  {% endif %}
