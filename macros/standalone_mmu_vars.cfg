# Happy-Hare-shaped hook configuration for the standalone (no MMU yet) filament system.
# Mirrors the structure of Happy Hare's mmu_macro_vars.cfg: no-op gcode_macros that exist
# purely to hold variable_* fields, read by the real hook macros in
# macros/standalone_mmu_hooks.cfg. All user_*_extension fields are empty (no-op) by default —
# adding an entry here changes behavior only where a hook actually consumes it.
#
# Naming: deliberately "_STANDALONE_*", never Happy Hare's real names (_MMU_SEQUENCE_VARS,
# _MMU_CLIENT_VARS, etc.) — those will be symlinked in read-only by Happy Hare's own installer
# once a real MMU is present, and colliding with them would break config load at that point.
#
# Kept minimal on purpose: only fields an actual hook reads are defined here. Do not
# pre-populate park-tuple/travel-speed/etc. fields Happy Hare's real _MMU_SEQUENCE_VARS carries
# — this printer's parking is still handled by explicit PAUSE X=/Y=/Z_MIN= calls inline in
# filament.cfg, not a _MMU_PARK-style engine, so those fields would just be unused noise and a
# future source of drift against the real values in macros/park.cfg / FILAMENT_VARS.

[gcode_macro _STANDALONE_SEQUENCE_VARS]
description: Happy-Hare-shaped hook config for load/unload. Read by macros/standalone_mmu_hooks.cfg.
gcode: # Leave empty
variable_user_pre_unload_extension    : "BLOBIFIER_PARK"
variable_user_post_form_tip_extension : ''
variable_user_post_unload_extension   : ''
variable_user_pre_load_extension      : ''
variable_user_post_load_extension     : ''
variable_user_mmu_error_extension     : ''

[gcode_macro _STANDALONE_CLIENT_VARS]
description: Feeds macros/standalone_mmu_client.cfg's PAUSE/RESUME/CANCEL_PRINT wrapper layer.
gcode: # Leave empty
variable_user_pause_extension  : ''
variable_user_resume_extension : ''
variable_user_cancel_extension : ''
