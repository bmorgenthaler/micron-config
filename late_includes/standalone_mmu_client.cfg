# REMOVED 2026-08-20 — this file redeclared [gcode_macro PAUSE]/[gcode_macro RESUME]/
# [gcode_macro CANCEL_PRINT] with rename_existing, intending to wrap mainsail.cfg's own
# same-named macros. Confirmed empirically that this does NOT work: Klipper's config reader
# is a Python RawConfigParser with strict=False, which MERGES same-named sections across every
# included file into one, with the LAST-loaded file's options completely overwriting the
# earlier ones — not layering them. Since this file loaded after mainsail.cfg, it would have
# silently discarded mainsail's own PAUSE/RESUME/CANCEL_PRINT gcode entirely, with no error
# (unlike the LINE_PURGE case, which hard-errored because nothing was left registered to
# rename — PAUSE/RESUME/CANCEL_PRINT are Klipper builtins, so a "previous command" was always
# findable, silently masking the corruption).
#
# Given how safety-critical PAUSE/RESUME/CANCEL_PRINT are, removed outright rather than
# reworked under time pressure. Left empty on purpose — do not add content without first
# reading this file's own git history / the incident writeup for the full reasoning.
#
# Separately discovered while diagnosing this: overrides.cfg's own [gcode_macro CANCEL_PRINT]
# (which resets FILAMENT_VARS mid-print-change state) and mainsail.cfg's later
# [gcode_macro CANCEL_PRINT] likely have this SAME collision — a pre-existing issue, not
# introduced tonight, needs its own dedicated verification/fix session. Not touched here.
