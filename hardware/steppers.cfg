################
# X/Y Steppers #
################

## X Stepper — Motor1 (B Motor)
[stepper_x]
step_pin: X_STEP
dir_pin: !X_DIR
enable_pin: !X_EN
rotation_distance: 32
microsteps: 32
full_steps_per_rotation: 200        # 400 for 0.9° steppers
position_min: 0
position_endstop: 166
position_max: 166
homing_positive_dir: true
homing_speed: 60
# Reverted to physical switch 2026-08-10 after a live sensorless test drove
# the full 166mm travel with zero stall trigger at driver_SGT=-64 (most
# sensitive possible setting) and rammed the X carriage into the X+ hard
# stop — belt teeth audibly slipped. Root cause not yet a config problem:
# the diag1_pin never saw a stall signal at all, which points at the DIAG1
# line not actually being wired from the TMC5160 to X_DIAG (PG1), wired to
# DIAG0 instead, or wrong polarity. Do NOT re-enable sensorless homing here
# until that's verified with a continuity check / scope on the physical
# board — see [[project_x_sensorless_homing]] memory for the full incident
# and the commented-out sensorless block below (kept for the eventual retry).
endstop_pin: ^thb:X_ENDSTOP
homing_retract_dist: 5

[tmc5160 stepper_x]
cs_pin: X_CS
spi_bus: spi4
interpolate: false
run_current: 0.8
sense_resistor: 0.075
# --- Sensorless homing (DISABLED 2026-08-10, see incident note above) ---
# diag1_pin: ^!X_DIAG
# driver_SGT: -64  # placeholder, never validated — full tuning notes in
#                  # [[project_x_sensorless_homing]] memory

## Y Stepper — Motor2 (A Motor)
[stepper_y]
step_pin: Y_STEP
dir_pin: !Y_DIR
enable_pin: !Y_EN
rotation_distance: 32
microsteps: 32
full_steps_per_rotation: 200        # 400 for 0.9° steppers
position_min: 0
position_endstop: 187.30
position_max: 190
homing_positive_dir: true
homing_speed: 60
endstop_pin: ^MCU_STOP_Y_ENDSTOP
homing_retract_dist: 5

[tmc5160 stepper_y]
cs_pin: Y_CS
spi_bus: spi4
interpolate: false
run_current: 0.8
sense_resistor: 0.075

##############
# Z Steppers #
##############

## Z0 — Front Left
[stepper_z]
step_pin: Z_STEP
dir_pin: !Z_DIR
enable_pin: !Z_EN
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop  # Beacon virtual endstop
position_max: 150
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0              # Required for Beacon contact homing

[tmc2209 stepper_z]
uart_pin: Z_UART
interpolate: true
run_current: 0.8
sense_resistor: 0.110

