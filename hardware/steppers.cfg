################
# X/Y Steppers #
################

## X Stepper — Motor1 (B Motor)
[stepper_x]
step_pin: X_STEP
dir_pin: !X_DIR
enable_pin: !X_EN
rotation_distance: 32
microsteps: 32
full_steps_per_rotation: 200        # 400 for 0.9° steppers
position_min: 0
position_endstop: 166
position_max: 166
homing_positive_dir: true
# Sensorless homing tuning start point: 1 rotation / 2s per Klipper's
# TMC_Drivers.md formula (rotation_distance/2 = 16). Raise once driver_SGT
# below is tuned and homing is confirmed reliable at higher speed.
homing_speed: 16
# Sensorless homing (switched from physical thb:X_ENDSTOP 2026-08-10).
# Requires diag1_pin below on [tmc5160 stepper_x].
endstop_pin: tmc5160_stepper_x:virtual_endstop
# Must be 0 for sensorless homing — disables the (unreliable) second homing
# move. See Klipper TMC_Drivers.md "Configure printer.cfg for sensorless
# homing".
homing_retract_dist: 0

[tmc5160 stepper_x]
cs_pin: X_CS
spi_bus: spi4
interpolate: false
run_current: 0.8
sense_resistor: 0.075
# Sensorless homing: DIAG1 pin from the TMC5160, physically wired to the
# X_DIAG (PG1) alias in hardware/LDOLeviathan.cfg. ^! = pullup + invert,
# matching Klipper's documented tmc2130/tmc5160 example — unlike tmc2209's
# diag_pin, which is pullup-only, uninverted.
diag1_pin: ^!X_DIAG
# TUNING REQUIRED — this is a placeholder, not a calibrated value.
# -64 = most sensitive (safe first-test value, per Klipper's tuning
# procedure: should barely move or stop immediately with wiring correct).
# 63 = least sensitive. Do NOT run this at print speed until tuned:
#   1. SET_TMC_FIELD STEPPER=stepper_x FIELD=sgt VALUE=-64, then G28 X0 —
#      confirm axis doesn't move / stops immediately. If it doesn't stop,
#      M112 immediately — wiring/polarity is wrong.
#   2. Raise VALUE and repeat until X reliably homes -> maximum_sensitivity.
#   3. Keep raising until it homes with a clean single touch (no bang/click)
#      -> minimum_sensitivity.
#   4. Final driver_SGT = minimum_sensitivity + (maximum_sensitivity -
#      minimum_sensitivity)/3, rounded.
# Do not have hold_current set on this driver (confirmed absent above) —
# required for sensorless homing per Klipper docs.
driver_SGT: -64

## Y Stepper — Motor2 (A Motor)
[stepper_y]
step_pin: Y_STEP
dir_pin: !Y_DIR
enable_pin: !Y_EN
rotation_distance: 32
microsteps: 32
full_steps_per_rotation: 200        # 400 for 0.9° steppers
position_min: 0
position_endstop: 187.30
position_max: 190
homing_positive_dir: true
homing_speed: 60
endstop_pin: ^MCU_STOP_Y_ENDSTOP
homing_retract_dist: 5

[tmc5160 stepper_y]
cs_pin: Y_CS
spi_bus: spi4
interpolate: false
run_current: 0.8
sense_resistor: 0.075

##############
# Z Steppers #
##############

## Z0 — Front Left
[stepper_z]
step_pin: Z_STEP
dir_pin: !Z_DIR
enable_pin: !Z_EN
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop  # Beacon virtual endstop
position_max: 150
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0              # Required for Beacon contact homing

[tmc2209 stepper_z]
uart_pin: Z_UART
interpolate: true
run_current: 0.8
sense_resistor: 0.110

