##########################################################################################
# The servo hardware configuration. Change the values to your needs.
# 
[servo blobifier]
# Pin for the servo.
pin: CHAMBER_RGB
# Adjust this value until a 'BLOBIFIER_SERVO POS=in' retracts the tray fully without a 
# buzzing sound
#minimum_pulse_width: 0.00053
minimum_pulse_width: 0.00050
# Adjust this value until a 'BLOBIFIER_SERVO POS=out' extends the tray fully without a 
# buzzing sound
#maximum_pulse_width: 0.0023
maximum_pulse_width: 0.0025
# Leave this value at 180
maximum_servo_angle: 180

##########################################################################################
# The bucket hardware configuration. Change the pin to whatever pin you've connected the 
# switch to.
# 
#[gcode_button bucket]
#pin: ^MCU_STOP_Z # The pullup ( ^ ) is important here.
#press_gcode:
#  M117 bucket installed
#release_gcode:
#  M117 bucket removed
#  _BLOBIFIER_COUNT_RESET

##########################################################################################
# Main macro. Usually you should only need to call this one or place it in the Happy Hare
# _MMU_POST_LOAD macro or variable_user_post_load_extension:
# PURGE_LENGTH=[float] (optional) The length to purge. If ommited it will check the 
#                      purge_volumes matrix or variable_purge_length
# PURGE_RET=[float]    (optional) The length to retract between moves
#
[gcode_macro BLOBIFIER]
# These parameters define your filament purging. The retract variable is used to retract 
# right after purging to prevent unnecessary oozing. Some filament are particularly oozy 
# and may continue to ooze out of the nozzle for a second or two after retracting. Update 
# as necessary.
variable_purge_spd:            400	     # Speed, in mm/min, of the purge.
variable_purge_temp_min:       230	     # Minimum nozzle purge temperature.
variable_retract_before_park:    1.0     # amount in mm. 0 to disable
variable_retract_speed:       2000       # mm/m

# State handoff for CONFIRM_BEFORE_SHEAR=1 (added 2026-08-21) -- when set, BLOBIFIER pauses for
# an interactive prompt right before shearing the final blob off the nozzle (so the extruded
# amount/color can be checked before it's separated and possibly cleaned away), instead of
# shearing/cleaning/restoring automatically. The prompt's Continue button calls
# _BLOBIFIER_CONFIRMED_SHEAR, a separate macro (Jinja {% set %} locals don't survive across
# separate macro calls, only these variable_* fields do) which finishes the deferred work.
# Don't set these by hand -- BLOBIFIER writes them itself via SET_GCODE_VARIABLE right before
# deferring.
variable_pending_restore_z          : 0
variable_pending_backup_fan_speed   : 0
variable_pending_backup_feedrate    : 1.0
variable_pending_skip_clean         : 0
variable_pending_continuation_macro : ''

# Adjust this so that your nozzle scrubs within the brush. Be careful not to go too low!
# Start out with a high value (like, 6) and go
# down from there.
# Matches macros/nozzle_brush.cfg CLEAN_NOZZLE's start_z (same physical brush), 2026-08-19.
variable_brush_top:             0.0

# These parameters define your scrubbing, travel speeds, safe z clearance and how many 
# times you want to wipe. Update as necessary.
variable_clearance_z:           5	         # When traveling, but not cleaning, the 
                                           #   clearance along the z-axis between nozzle 
                                           #   and brush.
variable_wipe_qty:              2	         # Number of complete (A complete wipe: left, 
                                           #   right, left OR right, left, right) wipes.
variable_travel_spd_xy:     5000	         # Travel (not cleaning) speed along x and 
                                           #   y-axis in mm/min.
variable_travel_spd_z:       1000	         # Travel (not cleaning) speed along z axis 
                                           #   in mm/min.
variable_wipe_spd_xy:       10000	         # Nozzle wipe speed in mm/min.


# These parameters define the size of the brush. Update as necessary. A visual reference 
# is provided below.
# 
#                  â†   brush_width   â†’                            
#                   _________________                                                          
#                  |                 |  â†‘                Y position is acquired from your 
#  brush_start (x) |                 | brush_depth       stepper_y position_max. Adjust 
#                  |_________________|  â†“                your brush physically in Y so 
#                          (y)                           that the nozzle scrubs within the 
#                      brush_front                       brush.                                              
# __________________________________________________________
#                     PRINTER FRONT
# 
# 
# Start location of the brush. Defaults for 250, 300 and 350mm are provided below.
# Uncomment as necessary
variable_brush_start:          52 # For 180mm build (inside buildplate posts)
#variable_brush_start:          34	# For 250mm build
#variable_brush_start:          35  # For 300mm build
#variable_brush_start:          84  # for 350mm build

# Y-axis centre of the brush. This is a separate physical location from the purge tray
# (purge_x/purge_y below) -- kept as its own variable rather than reusing purge_y so the
# two don't move together. Matches macros/nozzle_brush.cfg CLEAN_NOZZLE's start_y (same
# physical Bambu brush), verified 2026-08-19.
variable_brush_y:              180

# width of the brush
variable_brush_width:          33

# Location of where to purge. The tray is 15mm in length, so if you assemble it against
# the side of the bed (default), 10mm is a good location
# Confirmed live via jogged toolhead position over the physical blobifier platter, 2026-08-19
# (see project_blobifier_prep memory).
variable_purge_x: 1
variable_purge_y: 185

# Height of the tray. If it's below your bed, give this a negative number equal to the 
# difference. If it's above your bed, give it a positive number. You can find this number 
# by homing, optional QGL or equivalent, and moving you toolhead above the tray, and 
# lowering it with the paper method. 
#variable_tray_top: 1.2
variable_tray_top: .1


# ========================================================================================
# ==================== BLOB TUNING =======================================================
# ========================================================================================

# The following section defines how the purging sequence is executed. This is where you 
# tune the purging to create pretty blobs. Refer to the visual reference for a better 
# understanding. The visual is populated with example values. Below are some guides 
# provided to help with tuning.
#
#                          \_____________/
#                             |___|___|
#                                \_/            ______________  < End of third iteration.
#                                / \                                  HEIGHT:   3 x iteration_z_raise - (2 + 1) x iteration_z_change  (3 x 5 - 2 x 1.2 = 11.4)
#                               |   |                                 EXTRUDED: 3 x max_iteration_length                              (3 x 50 = 150)
#                              /     \          ______________  < End of second iteration.
#                             |       \                               HEIGHT:   2 x iteration_z_raise - 1 x iteration_z_change        (2 x 5 - 1 x 1.2 = 8.8)
#                            /         |                              EXTRUDED: 2 x max_iteration_length                              (2 x 50 = 100)
#                           |           \       ______________  < End of first iteration. 
#                          /             \                            HEIGHT:   1 x iteration_z_raise                                 (1 x 5 = 5)
#                         |               |                           EXTRUDED: 1 x max_iteration_length                              (1 x 50 = 50)
#___________               \             /      ______________  < Start height of the nozzle. default value: 1.5mm
#           |_______________\___________/_      ______________  < Bottom of the tray
#           |_____________________________|
#           |
# 
########################### BLOB TUNING ##############################
# +-------------------------------------+----------------------------+
# |  Filament sticks to the nozzle at   | Incr. purge start          |
# |    initial purge (first few mm)     |                            |
# +-------------------------------------+----------------------------+
# |  Filament scoots out from under     | Incr. temperature          |
# |  the nozzle at the first iteration  | Decr. iteration_z_raise    |
# |                                     | Incr. max_iteration_length |
# +-------------------------------------+----------------------------+
# |  Filament scoots out from under the | Decr. purge_spd            |
# |  the nozzle at later iterations     | Incr. iteration_z_change   |
# +-------------------------------------+----------------------------+
# |  Filament sticks to the nozzle at   | Decr. iteration_z_change   |
# |         later iterations            |                            |
# +-------------------------------------+----------------------------+
# |        I think my blobs can         | Balsy... Increase          |
# |          be much bigger!            | max_iterations_per_blob    |
# +-------------------------------------+----------------------------+
#

# The height to raise the nozzle above the tray before purging. This allows any built up 
# pressure to escape before the purge.
variable_purge_start: 0.1

# The maximum mm of filament (length) to extrude one iteration. A blob contains multiple 
# iterations
variable_max_iteration_length: 50

# The amount to raise Z for each iteration
variable_iteration_z_raise: 7

# As the nozzle gets higher and the blob wider, the Z raise needs to be reduced.
variable_iteration_z_change: 0.6

# Maximum iterations per blob. 3 Should be sufficient for most flushes. If not, Blobifier 
# will create multiple blobs for a single purge.
variable_max_iterations_per_blob: 3

# Lift the nozzle slightly after creating the blob te release pressure on the tray.
variable_eject_hop: 1

# Dwell time (ms) after the tray first retracts (opens up under the blob) and before it
# extends back in to shear/cut the blob off the nozzle. Gives the blob time to actually drop
# away under gravity (and the connecting string time to thin/cool) before the cut motion,
# rather than cutting almost immediately. Added 2026-08-19 after a blob stayed attached with
# the tray cutting too soon. Needs live tuning -- 500 is a starting guess, not measured.
variable_blob_drop_time: 500

# Dwell time (ms) after purging and before cleaning to relieve pressure from the nozzle.
variable_pressure_release_time: 1000

# Set the part cooling fan speed. Disabling can help prevent the nozzle from cooling down 
# and stimulate flow, Enabling it can prevent blobs from sticking together. Values range 
# from 0 .. 1, or -1 if you don't want it changed.
#variable_part_cooling_fan: -1              # Leave it unchanged
#variable_part_cooling_fan:  0              # Disable the fan
variable_part_cooling_fan:  1               # Run it at full speed


# ========================================================================================
# ==================== PURGE LENGTH TUNING ===============================================
# ========================================================================================

# Default purge length to fall back on when neither the tool map purge_volumes or 
# parameter PURGE_LENGTH is set.
variable_purge_length: 150

# The absolute minimum to purge, even if you don't changed tools. This is to prime the 
# nozzle before printing
variable_purge_length_minimum: 30

# The slicer values often are a bit too wastefull. Tune it here to get optimal values. 0.6
# is a good starting point.
variable_purge_length_modifier: 0.6

# Length of filament to add after the purge volume. Purge volumes don't always take 
# cutters into account and therefor a swap from red to white might be long enough, but 
# from white to red can be far too short. When should you alter this value:
#   INCREASE: When the dark to light swaps are good, but light to dark aren't.
#   DECREASE: When the light to dark swaps are good, but dark to light aren't. Don't 
#     forget to increase the purge_length_modifier
variable_purge_length_addition: 30

gcode:

  # ======================================================================================
  # ==================== RECORD STATE (INCL. FANS, SPEEDS, ETC...) =======================
  # ======================================================================================

  # General state
  SAVE_GCODE_STATE NAME=BLOBIFIER_state

  {% set skip_clean = params.SKIP_CLEAN|default(0)|int %}
  {% set confirm_before_shear = params.CONFIRM_BEFORE_SHEAR|default(0)|int %}
  {% set continuation_macro = params.CONTINUATION_MACRO|default('')|string %}

  # Captured unconditionally (not just guarded on part_cooling_fan>=0 like the M106 use below)
  # so it's always a real value to stash via SET_GCODE_VARIABLE if CONFIRM_BEFORE_SHEAR defers
  # the actual restore to _BLOBIFIER_CONFIRMED_SHEAR.
  {% set backup_fan_speed = printer.fan.speed %}
  # Part cooling fan
  {% if part_cooling_fan >= 0 %}
    # Set part cooling fan speed
    M106 S{part_cooling_fan * 255}
  {% endif %}

  # Set feedrate to 100% for correct speed purging
  {% set backup_feedrate = printer.gcode_move.speed_factor %}
  M220 S100
  
  # ======================================================================================
  # ==================== CHECK HOMING STATUS =============================================
  # ======================================================================================
  
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("BLOBIFIER: Not homed! Home xyz first")}
  {% endif %}
  
  {% if printer.quad_gantry_level and printer.quad_gantry_level.applied == False %}
    {action_raise_error("BLOBIFIER: QGL not applied!")}
  {% endif %}

  # ======================================================================================
  # ==================== DEFINE BASIC VARIABLES ==========================================
  # ======================================================================================
  
  {% set filament_diameter = printer.configfile.config.extruder.filament_diameter|float %}
  {% set filament_cross_section = (filament_diameter/2) ** 2 * 3.1415 %}
  #{% set from_tool = printer.mmu.last_tool %}
  #{% set to_tool = printer.mmu.tool %}
  {% set pos = printer.gcode_move.gcode_position %}
  {% set restore_z = [printer['gcode_macro BLOBIFIER_PARK'].restore_z,pos.z]|max %}
  {% set pos_max = printer.toolhead.axis_maximum %}
  {% set position_y = 189 %}

  # Get purge volumes from the slicer (if set up right. see 
  # https://github.com/moggieuk/Happy-Hare/blob/variables/doc/gcode_preprocessing.md)
 # {% set pv = printer.mmu.slicer_tool_map.purge_volumes %}
  
  # ======================================================================================
  # ==================== DETERMINE PURGE LENGTH ==========================================
  # ======================================================================================

  {% if params.PURGE_LENGTH %} # ======= PARAM PURGE LENGTH ==============================
    {action_respond_info("BLOBIFIER: param PURGE_LENGTH provided")}
    {% set purge_len = params.PURGE_LENGTH|float %}
  {% elif from_tool == to_tool %} # ==== TOOL DIDN'T CHANGE ==============================
    {action_respond_info("BLOBIFIER: Tool didn't change (T%s > T%s), " ~ 
      "priming" if purge_length_minimum else "skipping"  % (from_tool, to_tool))}
    {% set purge_len = 0 %}
  {% elif pv %} # ====================== FECTH FROM SLICER ===============================
    {% if from_tool < 0 and to_tool >= 0%}
      {action_respond_info("BLOBIFIER: from tool unknown. Finding largest value for T? > T%d" % to_tool)}
      {% set purge_vol = pv|map(attribute=to_tool)|max %}
    {% elif to_tool < 0 %}
      {action_respond_info("BLOBIFIER: tool(s) unknown. Finding largest value")}
      {% set purge_vol = pv|map('max')|max %}
    {% else %}
      {% set purge_vol = pv[from_tool][to_tool]|float * purge_length_modifier %}
      {action_respond_info("BLOBIFIER: Swapped T%s > T%s" % (from_tool, to_tool))}
    {% endif %}
    {% set purge_len = purge_vol / filament_cross_section + purge_length_addition %}
  {% else %} # ========================= USE CONFIG VARIABLE =============================
    {action_respond_info("BLOBIFIER: No toolmap or PURGE_LENGTH. Using default")}
    {% set purge_len = purge_length|float %}
  {% endif %}
  # ==================================== APPLY PURGE MINIMUM =============================
  {% set purge_len = [purge_len,purge_length_minimum]|max %}
  {action_respond_info("BLOBIFIER: Purging %.2fmm of filament" % (purge_len|float))}

  # Computed once, used both inside the iteration loop (gate the shear-vs-defer branch on the
  # final blob) and after it (gate whether the tail below runs now or was deferred to
  # _BLOBIFIER_CONFIRMED_SHEAR instead). Only defers if there's actually a purge happening.
  {% set deferred_shear = confirm_before_shear and purge_len|float > 0 %}

  # ======================================================================================
  # ==================== PURGING SEQUENCE ================================================
  # ======================================================================================

  # Set to absolute positioning.
  G90

  # Check for purge length and purge if necessary.
  {% if purge_len|float > 0 %}

    # ====================================================================================
    # ==================== POSITIONING (XY + hover) ======================================
    # ====================================================================================
    # Line up over the tray horizontally, but hover clearance_z above tray_top rather than
    # descending all the way -- lets heating (below) happen with the nozzle close to its
    # final position without resting right on top of the tray/servo for the whole soak.
    # Revised 2026-08-20: an earlier version heated first at wherever the toolhead already
    # was, then moved fully onto the tray afterward; reverted per feedback back to moving
    # into XY position before heating, just hovering instead of descending all the way.
    #
    # Z-safety-hop added 2026-08-21, before that XY move specifically -- this ordering itself
    # (XY first) is the deliberate 2026-08-20 choice above and is left alone, but there was no
    # Z clearance check at all before it, which combined with the tray sometimes already being
    # extended caused a real toolhead/tray collision live 2026-08-20 (belt skip, X endstop
    # fault). Raise to at least tray_top+clearance_z first, never lower than wherever the
    # toolhead already is. Same fix applied to BLOBIFIER_PARK, which had the identical gap.
    {% set safe_travel_z = [pos.z, tray_top + clearance_z]|max %}
    G1 Z{safe_travel_z} F{travel_spd_z}

    # Move to the assembly, first a bit more to the right (brush_start) to avoid a
    # potential filametrix pin if it's not already on the same Y coordinate.
    {% if printer.toolhead.position.y != position_y %}
      G1 X{brush_start} Y{purge_y} F{travel_spd_xy}
    {% endif %}
    # Move over to the tray
    G1 X{purge_x} F{travel_spd_xy}
    # Hover above the tray instead of descending onto it
    G1 Z{tray_top + clearance_z} F{travel_spd_z}

    # ====================================================================================
    # ==================== HEAT HOTEND ===================================================
    # ====================================================================================
    # Heat while hovering clear of the tray -- avoids soaking heat into the tray/servo
    # during a cold-start M109 wait (a minute or more) with the nozzle resting on top of
    # them. Fixed 2026-08-19, revised 2026-08-20 to hover rather than heat pre-travel.

    {% if printer.extruder.temperature < purge_temp_min %}
      {% if printer.extruder.target < purge_temp_min %}
        M109 S{purge_temp_min}
      {% else %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={purge_temp_min}
      {% endif %}
    {% endif %}

    # ====================================================================================
    # ==================== POSITIONING ON TRAY ===========================================
    # ====================================================================================
    # Now hot -- lower onto the tray.
    G1 Z{tray_top + purge_start} F{travel_spd_z}

    # Extend the blobifier
    BLOBIFIER_SERVO POS=out
    # Check if the servo is in correct position
    #{% if printer.mmu is defined and printer.mmu.enabled %}
    #  {% if printer.configfile.config.mmu.sync_to_extruder %}
     #   MMU_SYNC_GEAR_MOTOR SYNC=1
      #{% else %}
       # MMU_SERVO POS=up
    #  {% endif %}
   # {% endif %}

    # ====================================================================================
    # ==================== START ITERATING ===============================================
    # ====================================================================================
    
    # Calculate total number of iterations based on the purge length and the max_iteration 
    # length.
    {% set iterations = (purge_len / max_iteration_length)|round(0, 'ceil')|int %}

    # Repeat the process until purge_len is reached
    {% for n in range(iterations) %}
    
      # Calculate current iteration in current blob
      {% set step = n % max_iterations_per_blob %}

      {% if step == 0 %}
        G1 Z{tray_top + purge_start} F{travel_spd_z}
      {% endif %}

      # Determine the amount to extrude. Either the remaining purge_len or 
      # max_iteration_length.
      {% set purge_amount_left = purge_len - (max_iteration_length * n) %}
      {% set extrude_amount = [purge_amount_left,max_iteration_length]|min %}
      {% set extrude_ratio = extrude_amount / max_iteration_length %}

      # relative positioning
      G91 
      M83

      # Calculate the amount z has to be raised
      # If step equals 0, the start position of the nozzle is already a little higher.
      {% set step_triangular = step * (step + 1) / 2 %}
      {% set z_raise_substract = purge_start if step == 0 else 
        step_triangular * iteration_z_change %}
      {% set raise_z = (iteration_z_raise - z_raise_substract) * extrude_ratio %}

      # make sure raise_z never goes negative, dropping the nozzle while purging.
      {% set raise_z = [raise_z,0]|max %}

      # Calculate the raise speed based on the purge speed.
      {% set duration = extrude_amount / purge_spd %} 
      {% set speed = raise_z / duration %}
    
      # Purge one iteration
      G1 Z{raise_z} E{extrude_amount} F{speed}

      # ==================================================================================
      # ==================== DEPOSIT BLOB ================================================
      # ==================================================================================
      {% set max_iterations_reached = step == max_iterations_per_blob - 1 %}
      {% set purge_length_reached = purge_len - max_iteration_length * (n+1) <= 0 %}
      {% set is_final_shear = n == iterations - 1 %}
      {% if max_iterations_reached or purge_length_reached %}
        # Raise z a bit to relieve pressure on the blob preventing it to go sideways
        G1 Z{eject_hop} F{travel_spd_z}
        {% if deferred_shear and is_final_shear %}
          # CONFIRM_BEFORE_SHEAR=1: pause here instead of shearing automatically, so the
          # extruded amount/color can be checked at the nozzle before the blob is separated
          # (and possibly cleaned away). Only defers on the FINAL blob of this purge -- a
          # purge needing more than one blob (purge_len > max_iteration_length *
          # max_iterations_per_blob; not the case for this printer's actual load-purge
          # amounts) still shears the earlier blobs automatically here, unaffected. Added
          # 2026-08-21 at user's request: the existing _LOAD_PURGE_PROMPT confirmation only
          # fired after BLOBIFIER's automatic shear+clean had already destroyed the evidence.
          SET_GCODE_VARIABLE MACRO=BLOBIFIER VARIABLE=pending_restore_z VALUE={restore_z}
          SET_GCODE_VARIABLE MACRO=BLOBIFIER VARIABLE=pending_backup_fan_speed VALUE={backup_fan_speed}
          SET_GCODE_VARIABLE MACRO=BLOBIFIER VARIABLE=pending_backup_feedrate VALUE={backup_feedrate}
          SET_GCODE_VARIABLE MACRO=BLOBIFIER VARIABLE=pending_skip_clean VALUE={skip_clean}
          SET_GCODE_VARIABLE MACRO=BLOBIFIER VARIABLE=pending_continuation_macro VALUE="'{continuation_macro}'"
          RESPOND TYPE=command MSG="action:prompt_begin Verify Purge"
          RESPOND TYPE=command MSG="action:prompt_text Check the purged amount/color at the nozzle, then continue to shear the blob."
          RESPOND TYPE=command MSG="action:prompt_button_group_start"
          RESPOND TYPE=command MSG="action:prompt_button Continue|_BLOBIFIER_CONFIRMED_SHEAR"
          RESPOND TYPE=command MSG="action:prompt_button_group_end"
          RESPOND TYPE=command MSG="action:prompt_show"
        {% else %}
          # Retract the tray
          BLOBIFIER_SERVO POS=in
          # Let the blob actually drop clear under gravity (and any connecting string thin/cool)
          # before the tray closes back in to shear it -- previously the tray came back in on
          # BLOBIFIER_SERVO's own 400ms dwell alone, too soon, and cut through material that
          # hadn't separated yet. Fixed 2026-08-19.
          G4 P{blob_drop_time}
          # Move the toolhead down to purge_start height lowering the blob below the tray
          G90 # absolute positioning
          G1 Z{tray_top + purge_start}
          # Extend the tray to 'cut off' the blob and prepare for the next blob
          BLOBIFIER_SERVO POS=out
          BLOBIFIER_SERVO POS=in
          BLOBIFIER_SERVO POS=out
          # Raise clear of the tray/blob before anything else happens. Previously the nozzle
          # stayed parked at tray_top+purge_start (~0.3mm) straight through the
          # pressure_release_time dwell below -- right on top of the blob -- so a longer dwell
          # there just gave still-soft plastic more time to wick back up the nozzle instead of
          # separating. Reuses clearance_z, same convention as BLOBIFIER_CLEAN's post-wipe
          # raise. Fixed 2026-08-19.
          G1 Z{tray_top + purge_start + clearance_z} F{travel_spd_z}
          # Blob counting/bucket-shake removed 2026-08-20 (_BLOBIFIER_COUNT and friends
          # commented out below) -- no call here anymore.
        {% endif %}
      {% endif %}
    {% endfor %}
  {% endif %}
  {% if not deferred_shear %}
  G4 P{pressure_release_time}
  # Swapped from BLOBIFIER_CLEAN (brass-brush wipe below, now unused/commented out) to the
  # existing CLEAN_NOZZLE routine (macros/nozzle_brush.cfg) at user's request 2026-08-20 --
  # its zigzag wipe does a better job than Blobifier's straight in/out wipe. No position
  # conflict: CLEAN_NOZZLE's start_x/start_y/start_z (52/180/0.0) already match
  # brush_start/brush_y/brush_top, which were deliberately aligned to it earlier this
  # session. CLEAN_NOZZLE ends absolute-positioned and raised (raise_distance), and this
  # call sits inside BLOBIFIER's own SAVE_GCODE_STATE/RESTORE_GCODE_STATE pair, so no state
  # leaks back to the caller.
  #
  # SKIP_CLEAN=1 (optional param, default 0/off) added 2026-08-21: _LOAD_PURGE
  # (macros/filament.cfg) calls BLOBIFIER as part of a confirm-before-cleaning flow --
  # _LOAD_PURGE_PROMPT ("did it purge correctly?") only fires after this macro returns, so
  # cleaning here made the prompt pointless (confirmed live: nozzle already wiped by the time
  # the user was asked to judge it). _LOAD_PURGE now passes SKIP_CLEAN=1 and the actual clean
  # happens after confirmation instead (_LOAD_FILAMENT_DONE / _MIDPRINT_CLEAN_AND_RESUME).
  # Default (SKIP_CLEAN unset) keeps cleaning here, unchanged, for BLOBIFIER's own standalone
  # use where there's no confirmation step to wait for.
  {% if not skip_clean %}
    CLEAN_NOZZLE
  {% endif %}

  # ======================================================================================
  # ==================== RESTORE STATE ===================================================
  # ======================================================================================

  G1 Z{restore_z} F{travel_spd_z}

  {% if part_cooling_fan >= 0 %}
    # Reset part cooling fan if it was changed
    M106 S{backup_fan_speed * 255}
  {% endif %}

  M220 S{backup_feedrate * 100}

  RESTORE_GCODE_STATE NAME=BLOBIFIER_state
  {% if continuation_macro %}
    {continuation_macro}
  {% endif %}
  {% endif %}

##########################################################################################
# Continuation of BLOBIFIER after a CONFIRM_BEFORE_SHEAR=1 pause -- finishes the shear/
# clean/restore that BLOBIFIER itself deferred when it showed the "Verify Purge" prompt.
# Never call this directly except via that prompt's Continue button; it depends on the
# pending_* state BLOBIFIER stashes right before deferring.
#
[gcode_macro _BLOBIFIER_CONFIRMED_SHEAR]
gcode:
  {% set bl = printer['gcode_macro BLOBIFIER'] %}
  RESPOND TYPE=command MSG="action:prompt_end"

  BLOBIFIER_SERVO POS=in
  G4 P{bl.blob_drop_time}
  G90
  G1 Z{bl.tray_top + bl.purge_start}
  BLOBIFIER_SERVO POS=out
  BLOBIFIER_SERVO POS=in
  BLOBIFIER_SERVO POS=out
  G1 Z{bl.tray_top + bl.purge_start + bl.clearance_z} F{bl.travel_spd_z}

  G4 P{bl.pressure_release_time}
  {% if not bl.pending_skip_clean %}
    CLEAN_NOZZLE
  {% endif %}
  G1 Z{bl.pending_restore_z} F{bl.travel_spd_z}
  {% if bl.part_cooling_fan >= 0 %}
    M106 S{bl.pending_backup_fan_speed * 255}
  {% endif %}
  M220 S{bl.pending_backup_feedrate * 100}
  RESTORE_GCODE_STATE NAME=BLOBIFIER_state
  {% if bl.pending_continuation_macro %}
    {bl.pending_continuation_macro}
  {% endif %}

##########################################################################################
# Wipes the nozzle on the brass brush
#
# Commented out 2026-08-20 -- BLOBIFIER now calls CLEAN_NOZZLE (macros/nozzle_brush.cfg)
# instead; its zigzag wipe outperformed this straight in/out wipe in live testing. Left
# here, disabled, rather than deleted in case the trade-off (CLEAN_NOZZLE is a bit slower --
# 10 wipes with a zigzag vs. this one's wipe_qty straight passes) needs revisiting.
#
#[gcode_macro BLOBIFIER_CLEAN]
#gcode:
#  {% set bl = printer['gcode_macro BLOBIFIER'] %}
#  {% set position_y = bl.brush_y %}
#  # Position for wipe. Either left or right of brush based off bucket_pos to avoid
#  # unnecessary travel.
#
#  SAVE_GCODE_STATE NAME=BLOBIFIER_CLEAN_state
#
#  G90
#
#  G1 Z{bl.brush_top + bl.clearance_z} F{bl.travel_spd_z}
#  G1 X{bl.brush_start} F{bl.travel_spd_xy}
#  G1 Y{position_y}
#
#  # Move nozzle down into brush.
#  G1 Z{bl.brush_top} F{bl.travel_spd_z}
#
#  # Perform wipe. Wipe direction based off bucket_pos for cool random scrubby routine.
#  {% for wipes in range(1, (bl.wipe_qty + 1)) %}
#     G1 X{bl.brush_start + bl.brush_width} F{bl.wipe_spd_xy}
#     G1 X{bl.brush_start} F{bl.wipe_spd_xy}
#  {% endfor %}
#
#  # Raise clear of the brush after wiping. RESTORE_GCODE_STATE below does not move the
#  # toolhead (no MOVE=1), so without this the nozzle was left parked down at brush_top
#  # (Z0.0) in the bristles -- confirmed live 2026-08-19. Reuses clearance_z, the same
#  # variable already used for the approach lift above, rather than a separate constant.
#  G1 Z{bl.brush_top + bl.clearance_z} F{bl.travel_spd_z}
#
#  RESTORE_GCODE_STATE NAME=BLOBIFIER_CLEAN_state



##########################################################################################
# Park the nozzle on the tray to prevent oozing during filament swaps. Place this 
# extension in the pre-unload extension in mmu_macro_vars.cfg:
#   variable_user_pre_unload_extension: "BLOBIFIER_PARK"
#
[gcode_macro BLOBIFIER_PARK]
variable_restore_z: 0
gcode:
  {% set bl = printer['gcode_macro BLOBIFIER'] %}
  {% set pos = printer.gcode_move.gcode_position %}
  {% set pos_max = printer.toolhead.axis_maximum %}
  {% set position_y = bl.purge_y %}

  SET_GCODE_VARIABLE MACRO=BLOBIFIER_PARK VARIABLE=restore_z VALUE={pos.z}

  SAVE_GCODE_STATE NAME=blobifier_park_state
  
  {% if "xy" not in printer.toolhead.homed_axes %}
    RESPOND MSG="Automatically homing XY"
    G28 X Y
  {% endif %}
  
  {% if "z" not in printer.toolhead.homed_axes %}
    RESPOND MSG="Automatically homing Z"
    G28 Z
  {% endif %}
  
  {% if printer.quad_gantry_level and printer.quad_gantry_level.applied == False %}
    RESPOND MSG="Automatically QGL"
    quad_gantry_level
  {% endif %}

  G90

  G1 E-{bl.retract_before_park} F{bl.retract_speed}
  # Z-safety-hop before any horizontal travel toward the tray -- fixed 2026-08-21. Previously
  # this macro moved XY first with no Z clearance check at all; combined with the tray
  # sometimes already being extended, that caused a real toolhead/tray collision live
  # 2026-08-20 (belt skip, X endstop fault). Raise to at least tray_top+clearance_z (matching
  # BLOBIFIER's own hover height in its main gcode), never lower than wherever the toolhead
  # already is.
  {% set safe_travel_z = [pos.z, bl.tray_top + bl.clearance_z]|max %}
  G1 Z{safe_travel_z} F{bl.travel_spd_z}
  G1 X{bl.brush_start} Y{bl.purge_y} F{bl.travel_spd_xy}
  G1 X{bl.purge_x}
  G1 Z{bl.tray_top} F{bl.travel_spd_z}

  RESTORE_GCODE_STATE NAME=blobifier_park_state

##########################################################################################
# Retract or extend the tray 
# POS=[in|out] Retractor extend the tray
#
[gcode_macro BLOBIFIER_SERVO]
# increase this value if the servo doesn't have enough time to fully retract or extend
variable_dwell_time: 400
gcode:
  {% set pos = params.POS %}
  {% if pos == "in" or pos == "0" %}
    SET_SERVO SERVO=blobifier ANGLE=180
    G4 P{dwell_time}
  {% elif pos == "out" or pos == "1" %}
    SET_SERVO SERVO=blobifier ANGLE=0
    G4 P{dwell_time}
  {% else %}
    {action_respond_info("BLOBIFIER: provide POS=[in|out]")}
  {% endif %}
  SET_SERVO SERVO=blobifier WIDTH=0

