## Includes
# --------------------------------------------------------------------
# Macros
[include macros/*.cfg]

# Boards and Hardware
[include hardware/beacon.cfg]
[include hardware/LDOLeviathan.cfg]
[include hardware/LDONH36.cfg]
[include hardware/steppers.cfg]
[include hardware/toolhead.cfg]
# hardware/blobifier.cfg removed 2026-08-22 -- moved to ~/blobifier.cfg (out of the active
# config), rolling back all Blobifier wiring. See macros/filament.cfg's git history / session
# notes for what depended on it.

# Plugins
#[include plugins/tmc_autotune.cfg]
[include plugins/shaketune.cfg]
# KAMP disabled 2026-08-27 (user request). This pulled in _KAMP_Settings + KAMP's
# Adaptive_Meshing.cfg (rename_existing wrapper on BED_MESH_CALIBRATE) + Line_Purge.cfg
# (LINE_PURGE). With this out, BED_MESH_CALIBRATE reverts to stock Klipper's, whose native
# ADAPTIVE=1 param (used in macros/print_start.cfg) still gives an adaptive mesh from
# [exclude_object] data. To re-enable KAMP: uncomment both includes below + the SAFE_LINE_PURGE
# call in macros/print_start.cfg.
#[include KAMP_Settings.cfg]

# line_purge_safety.cfg only exists to guard KAMP's LINE_PURGE — disabled alongside KAMP above.
# It references _KAMP_Settings and calls LINE_PURGE, neither of which exist without KAMP, so it
# cannot stay included on its own.
#[include late_includes/line_purge_safety.cfg]

[save_variables]
filename: ~/printer_data/config/variables.cfg

## Mainboard - Leviathan v1.3
[mcu]
# UART Mode
serial: /dev/ttyAMA0
baud: 250000
restart_method: command

# Toolhead Board - Nighthawk 36
#--------------------------------------------------------------------
[mcu thb]
serial: /dev/serial/by-id/usb-Klipper_rp2040_303339383405578E-if00
#serial: /dev/serial/by-id/usb-Klipper_rp2040_323232323619906E-if00
restart_method: command

# Support for per object cancellation
[exclude_object]

###########
# WEB GUI #
###########

# Mainsail
[include mainsail.cfg]

[printer]
kinematics: corexy
max_velocity: 200  
max_accel: 10000   
max_z_velocity: 25 			
max_z_accel: 350
square_corner_velocity: 5

[force_move]
enable_force_move: True

#######################
# Temperature Sensors #
#######################

#[temperature_sensor Leviathan]
#sensor_type: temperature_mcu

[temperature_sensor rPi]
sensor_type: temperature_host

[temperature_sensor nvme]
sensor_type: temperature_host
sensor_path: /sys/class/nvme/nvme0/hwmon1/temp1_input

[temperature_sensor NH36]
sensor_type: temperature_mcu
sensor_mcu: thb
min_temp: -20 
max_temp: 100

[temperature_sensor Chamber_Front_Right]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: MCU_T3
pullup_resistor: 2200


########
# ADXL #
########

[adxl345]
cs_pin: thb:ADXL_CS
spi_software_sclk_pin: thb:ADXL_SCLK
spi_software_mosi_pin: thb:ADXL_MOSI
spi_software_miso_pin: thb:ADXL_MISO
#axes_map: x,y,z
axes_map: -x, -z, -y

[resonance_tester]
accel_chip: beacon
#accel_chip: adxl345
accel_per_hz: 75 # was 150
probe_points: 87,90,20
max_freq: 150
sweeping_period: 1


## # Wihtout TMC Autotune
# Tuned 08/04/2026
[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 63.8
damping_ratio_x: 0.057

# For low vibrations, for performance do mzv @ 80
shaper_type_y: ei
shaper_freq_y: 95
damping_ratio_y: 0.04

# With TMC Autotune
#[input_shaper]
#shaper_type_x: mzv
#shaper_freq_x: 72.2
#damping_ratio_x: 0.057
#
#shaper_type_y: mzv
#shaper_freq_y: 85.0 
#damping_ratio_y: 0.039

[skew_correction]

###############
# Fan Control #
###############

[fan]
##	Part Cooling Fan
pin: thb:PC_FAN
kick_start_time: 0.5
##	Depending on your fan, you may need to increase this value
##	if your fan will not start. Can change cycle_time (increase)
##	if your fan is not able to slow down effectively
#off_below: 0.10
#min_power: 0  # Kalico-only option for [fan]; not valid in stock Klipper

[heater_fan hotend]
pin: thb:HE_FAN
heater: extruder
heater_temp: 75.0 # was 50
kick_start_time: 0.5
max_power: 1.0
tachometer_pin: thb:HE_TACH  #Uncomment for Tach on NH36

[controller_fan electronics_bay_exhaust]
pin: MCU_FAN
max_power: 1.0
kick_start_time: 0.1
fan_speed: 1.0
idle_speed: 0.25
tachometer_pin: ^MCU_FAN0_TACHO
tachometer_ppr: 2
tachometer_poll_interval: 0.0010

[controller_fan electronics_bay_supply]
pin: MCU_FAN3
max_power: 1.0
kick_start_time: 0.1
fan_speed: 1.0
idle_speed: 0.25
tachometer_pin: ^MCU_FAN3_TACHO
tachometer_ppr: 2
tachometer_poll_interval: 0.0010


###############
# LED Control #
###############

# Chamber Daylight on Matchstick
[led Chamber]
white_pin: CHAMBER_LED
initial_WHITE: 0.25   # bumped from 0.1 2026-08-12 — 10% was barely visible on config load/restart
hardware_pwm: false
cycle_time: 0.01

# Nitehawk RGB
# Named plain Toolhead (no leading underscore) since 2026-08-24 — reverted from the
# klipper-led_effect nozzle_lights split (hardware/led_effects.cfg, now removed). All 3
# indices are driven by raw SET_LED calls (macros/toolhead_leds.cfg: _SET_TH_LED for index 1,
# NOZZLE_LIGHTS_ON/OFF for index 2-3), so the whole-chain card in Mainsail's Miscellaneous
# panel no longer conflicts with anything — showing it there is now the intended way to
# control this object, not a hazard to hide.
[neopixel Toolhead]
pin: thb:RGB
chain_count: 3         # 1 in front, 2 as nozzle lights
color_order: GRBW      # LDO neopixel is GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

#################
# Carbon Filter #
#################
[fan_generic filter]
pin: FILTER_FAN

###################
# Bed Fan Control #
###################
[heater_generic chamber]
heater_pin: BED_FAN
sensor_type: Generic 3950
#sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: CHAMBER_TEMP
control: pid
pid_Kp: 61.470837
pid_Ki: 0.5
pid_Kd: 0
#pwm_cycle_time: 0.3
pwm_cycle_time: 0.01 #Might burn them out or generate too much heat https://discord.com/channels/825469421346226226/1061793771169263726/1535279122312597627
min_temp: -273.15
max_temp: 75
gcode_id: C
pullup_resistor: 2200

[verify_heater chamber]
max_error: 120
check_gain_time: 120
hysteresis: 50
heating_gain: 1

#########################################
# Heat Bed with two sensors	        #
#########################################

# Inner mat sensor — kept active for monitoring even under stock Klipper
[temperature_sensor bed_inner]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: BED_TEMP_INNER   # Inner Loop: Heater Mat (Fast), under the mat
pullup_resistor: 2200        # For the Leviathan
min_temp: 0
max_temp: 135                # Safety limit for the heater mat itself

[verify_heater heater_bed]
check_gain_time: 120

#############################
# Stock Klipper Bed Heater  #
#############################
# Single-loop PID on the plate sensor (BED_TEMP_OUTER).
# Outer-loop PID values used as starting point; re-run PID_CALIBRATE after switch.
[heater_bed]
heater_pin: BED_HEATER
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: BED_TEMP_OUTER
pullup_resistor: 2200
max_power: 1.0
min_temp: 0
max_temp: 130
#control: pid
#pid_kp: 47.918
#pid_ki: 2.986
#pid_kd: 192.269

############
# Extruder #
############

[extruder]
step_pin: thb:E_STEP
dir_pin: !thb:E_DIR
enable_pin: !thb:E_EN
heater_pin: thb:HE_HEATER
sensor_type: ATC Semitec 104NT-4-R025H42G # Revo HF
pullup_resistor: 2200
sensor_pin: thb:HE_TEMP
#control: pid
#pid_kp = 23.211
#pid_ki = 2.276
#pid_kd = 59.188
min_temp: 0
min_extrude_temp: 0
max_temp: 300
microsteps: 16
full_steps_per_rotation: 200    # 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
pressure_advance: 0.05
pressure_advance_smooth_time: 0.040 # this can be calibrated later
rotation_distance: 47.088
gear_ratio: 9:1
max_extrude_only_distance: 200
max_extrude_cross_section: 5      # required for KAMP LINE_PURGE; default (4*nozzle_dia²=0.64) is too small


#########################################
# Homing and Gantry Adjustment Routines #
#########################################

[idle_timeout]
timeout: 1800
gcode:
    SCREEN_OFF
    M18
    SET_LED LED=Chamber WHITE=0
    # Turn all Toolhead LEDs off
    _STATUS_OFF
    
[quad_gantry_level]
speed: 100
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

#--------------------------------------------------------------------

##  Gantry Corners for 180 Build
gantry_corners:
   -60.2,-10.4
   244.1,234.5
##  Probe points
points:
  13,1
  13,140
  160,140
  160,1

[include moonraker_obico_macros.cfg]

